<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0FA">
<title>예비고1 고전어휘 퀴즈 · 돋움국어논술학원</title>
<style>
:root{
  --purple:#6E5B9A; --purple-dark:#56457F; --purple-soft:#8A78B4;
  --lav:#ECE8F6; --lav-2:#F7F5FC; --lav-3:#DCD4EE;
  --ink:#2B2438; --ink-2:#5B5468; --ink-3:#8C859B;
  --mint:#7ED9C3; --mint-ink:#1F5F4E; --mint-bg:#E7F8F3;
  --gold:#FFD97A; --gold-ink:#7A5B00; --gold-bg:#FFF6DF;
  --green:#2E9E6B; --green-bg:#E7F6EE;
  --red:#D24B4B; --red-bg:#FBEAEA;
  --paper:#fff; --bg:#F3F0FA; --line:#E4DEF0;
  --shadow:0 8px 24px rgba(76,60,120,.08);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 620px at 50% -10%,#FBFAFE 0%,var(--bg) 55%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.app{max-width:980px;margin:0 auto;padding:0 0 44px}

/* ── 헤더 ── */
.hdr{position:sticky;top:0;z-index:40;padding:10px 16px 8px;
  background:linear-gradient(180deg,rgba(247,245,252,.98) 62%,rgba(243,240,250,0));
  backdrop-filter:blur(8px)}
.hdr-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-size:11.5px;font-weight:800;letter-spacing:.2px;color:var(--purple);white-space:nowrap}
.brand span{color:var(--ink-3);font-weight:700}
.hdr-title{font-size:19px;font-weight:900;letter-spacing:-.6px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.2px;transition:.15s}
.wk.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(110,91,154,.28)}

.screen{padding:6px 16px 0}

/* ── 홈 ── */
.hero{padding:10px 2px 2px}
.hero h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-1px;line-height:1.25;word-break:keep-all}
.hero h1 em{color:var(--purple);font-style:normal}
.hero p{margin:7px 0 0;font-size:13px;color:var(--ink-2);word-break:keep-all}
.hero p b{color:var(--purple)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;max-width:620px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px;font-weight:900;color:var(--purple);letter-spacing:-.5px}
.stat span{font-size:10.5px;font-weight:700;color:var(--ink-3)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px;gap:8px}
.sec-h h2{margin:0;font-size:15px;font-weight:900;letter-spacing:-.4px}
.sec-h .hint{font-size:11.5px;color:var(--ink-3);font-weight:700;text-align:right}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);
  padding:13px 13px 12px;box-shadow:var(--shadow);transition:transform .12s;
  display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.mcard:active{transform:scale(.985)}
.mcard .ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--lav);display:grid;place-items:center}
.mcard .ic svg{width:26px;height:26px;display:block}
.mcard .txt{min-width:0}
.mcard h3{margin:0;font-size:14.5px;font-weight:900;letter-spacing:-.4px;word-break:keep-all}
.mcard p{margin:0;font-size:11.5px;line-height:1.5;color:var(--ink-3);word-break:keep-all;font-weight:600}
.mcard .tag{position:absolute;top:11px;right:11px;font-size:9.5px;font-weight:900;color:var(--purple);
  background:var(--lav);border-radius:999px;padding:3px 8px}
.mcard.wide{grid-column:1/-1}
@media (min-width:640px){
  .mcard{flex-direction:row;align-items:center;gap:13px}
  .mcard .txt{flex:1}
  .mcard .tag{position:static;flex:0 0 auto;margin-left:4px}
}

/* ── 공통 바 ── */
.sbar{display:flex;align-items:center;gap:9px;padding:4px 0 10px}
.sbar .bk{font-size:12.5px;font-weight:800;color:var(--purple);background:#fff;border:1.5px solid var(--line);
  border-radius:999px;padding:5px 11px}
.sbar .ttl{font-size:14px;font-weight:900;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .cnt{font-size:11.5px;font-weight:800;color:var(--ink-3)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── 암기 카드 ── */
.fcard{background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:16px 16px 18px;text-align:center;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.fc-cat{font-size:10.5px;font-weight:900;letter-spacing:.3px;color:var(--purple);background:var(--lav);
  border-radius:999px;padding:4px 10px}
.fc-art{width:100px;height:100px;margin:4px auto 0}
.fc-art svg{width:100%;height:100%;display:block;transform:scale(1.12)}
.fc-w{font-size:29px;font-weight:900;letter-spacing:-.8px;line-height:1.2;margin-top:2px}
.fc-h{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:2px}
.fc-rev{width:100%;text-align:left;margin-top:8px;border-top:1px dashed var(--line);padding-top:11px}
.fc-m{font-size:14.5px;font-weight:800;line-height:1.6;color:var(--ink);word-break:keep-all;margin:0}
.fc-ex{font-size:12.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.6;word-break:keep-all;
  background:var(--lav-2);border-radius:12px;padding:9px 11px}
.fc-src{font-size:10.5px;color:var(--ink-3);font-weight:700;margin:7px 0 0}
.tipbox{margin-top:9px;background:var(--gold-bg);border:1px solid #F6E3B0;border-radius:12px;padding:9px 11px}
.tipbox b{display:block;font-size:10.5px;color:var(--gold-ink);letter-spacing:.2px;margin-bottom:2px}
.tipbox span{font-size:12px;font-weight:700;color:#6B5410;line-height:1.55;word-break:keep-all}
.fc-tap{margin-top:12px;width:100%;height:44px;border-radius:14px;background:var(--lav);color:var(--purple-dark);
  font-size:13.5px;font-weight:900}
.fc-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fc-act button{height:46px;border-radius:14px;font-size:13.5px;font-weight:900;border:1.5px solid transparent}
.b-hard{background:#fff;border-color:#F0CFCF;color:#B44848}
.b-ok{background:var(--mint);color:var(--mint-ink)}
.fc-nav{display:flex;gap:8px;margin-top:9px}
.fc-nav button{flex:1;height:40px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:800;color:var(--ink-2)}
.doneflag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--green);
  background:var(--green-bg);border-radius:999px;padding:3px 9px;margin-top:6px}
.doneflag.hard{color:#B44848;background:var(--red-bg)}
.pbar{height:6px;border-radius:999px;background:var(--lav);overflow:hidden;margin:2px 0 12px}
.pbar i{display:block;height:100%;background:var(--purple);border-radius:999px;transition:width .25s}
.empty{text-align:center;padding:34px 14px;background:#fff;border:1.5px dashed var(--line);border-radius:20px}
.empty p{margin:0 0 10px;font-size:13px;color:var(--ink-2);font-weight:700}
.empty button{background:var(--purple);color:#fff;font-weight:900;font-size:13px;border-radius:12px;padding:10px 16px}

/* ── 퀴즈 ── */
.qwrap{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.qdir{display:flex;gap:6px;margin-bottom:12px}
.qdir button{flex:1;height:36px;border-radius:11px;background:var(--lav-2);border:1.5px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--ink-2)}
.qdir button.on{background:#fff;border-color:var(--purple);color:var(--purple);box-shadow:0 2px 8px rgba(110,91,154,.14)}
.qlead{font-size:11.5px;font-weight:800;color:var(--ink-3);letter-spacing:.2px}
.qword{font-size:30px;font-weight:900;letter-spacing:-.8px;line-height:1.3;margin:6px 0 14px;word-break:keep-all}
.qword.small{font-size:17px;letter-spacing:-.3px;line-height:1.55;font-weight:800}
.opt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:7px;
  font-size:13.5px;font-weight:700;line-height:1.5;word-break:keep-all;transition:.12s}
.opt .num{flex:0 0 18px;height:18px;border-radius:50%;background:var(--lav);color:var(--purple);
  font-size:10.5px;font-weight:900;display:grid;place-items:center;margin-top:1px}
.opt.ok{border-color:#8FD9BF;background:var(--green-bg)}
.opt.ok .num{background:var(--green);color:#fff}
.opt.no{border-color:#EFBEBE;background:var(--red-bg)}
.opt.no .num{background:var(--red);color:#fff}
.opt:disabled{opacity:1}
.fb{margin-top:11px;border-radius:14px;padding:11px 12px;font-size:12.5px;font-weight:700;line-height:1.6;word-break:keep-all}
.fb.ok{background:var(--green-bg);color:#1C6C4A}
.fb.no{background:var(--red-bg);color:#9C3535}
.fb b{font-weight:900}
.qnext{margin-top:11px;width:100%;height:46px;border-radius:14px;background:var(--purple);color:#fff;
  font-size:14px;font-weight:900;box-shadow:0 8px 18px rgba(110,91,154,.26)}
.qnext:disabled{opacity:.45;box-shadow:none}

/* ── 실전 테스트 ── */
.tbox{background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:15px}
.thead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.sec-b{font-size:10.5px;font-weight:900;color:#fff;background:var(--purple);border-radius:7px;padding:3px 8px}
.pat-b{font-size:10.5px;font-weight:800;color:var(--ink-2);background:var(--lav-2);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.mir-b{font-size:10.5px;font-weight:900;color:var(--gold-ink);background:var(--gold-bg);border:1px solid #F1DCA6;border-radius:7px;padding:3px 8px}
.tstem{font-size:14.5px;font-weight:900;line-height:1.55;letter-spacing:-.3px;word-break:keep-all;margin:0 0 9px}
.passage{background:var(--lav-2);border-left:3px solid var(--lav-3);border-radius:0 12px 12px 0;
  padding:10px 12px;font-size:13px;line-height:1.7;color:var(--ink-2);white-space:pre-line;margin-bottom:11px;word-break:keep-all}
.ansview{background:var(--lav-2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.65}
.ansview b{color:var(--purple)}
textarea.sa{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:12px;padding:10px;
  font-size:13.5px;line-height:1.6;resize:vertical;background:#fff;color:var(--ink)}
textarea.sa:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(110,91,154,.12)}
.selfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.selfg button{height:44px;border-radius:12px;font-size:13px;font-weight:900;border:1.5px solid var(--line);background:#fff;color:var(--ink-2)}
.selfg button.y{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.selfg button.n{background:#fff;border-color:#F0CFCF;color:#B44848}

/* ── 결과 ── */
.score{text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);padding:20px 16px}
.score .lab{font-size:12px;font-weight:800;color:var(--purple);letter-spacing:.3px}
.score .big{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.15;margin:2px 0 0;color:var(--ink)}
.score .big small{font-size:17px;color:var(--ink-3);font-weight:800;letter-spacing:0}
.score .msg{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.tbl{table-layout:fixed}
.tbl th:nth-child(1),.tbl td:nth-child(1){width:34%}
.tbl th:nth-child(2),.tbl td:nth-child(2){width:26%;white-space:nowrap}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:10.5px;color:var(--ink-3);font-weight:800}
.tbl td.n{text-align:right;font-weight:800;color:var(--purple);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}

/* ── 오답 노트 ── */
.wcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.wcard .wq{font-size:13px;font-weight:800;line-height:1.55;word-break:keep-all;margin:0 0 7px}
.wcard .wa{font-size:12px;color:var(--ink-2);line-height:1.6;word-break:keep-all}
.wcard .wa b{color:var(--purple)}
.wcard .wtag{font-size:10px;font-weight:900;color:var(--ink-3);background:var(--lav-2);border-radius:6px;padding:2px 7px;margin-right:5px}
.wrow{display:flex;gap:7px;margin-top:9px}
.wrow button{flex:1;height:36px;border-radius:10px;background:var(--lav-2);border:1px solid var(--line);
  font-size:11.5px;font-weight:800;color:var(--ink-2)}
.wrow .del{flex:0 0 62px;margin-left:auto;color:#B44848;background:#fff;border-color:#F0CFCF}
.bigbtn{width:100%;height:48px;border-radius:14px;background:var(--purple);color:#fff;font-size:14px;font-weight:900;
  box-shadow:0 8px 18px rgba(110,91,154,.24);margin-top:4px}
.ghostbtn{width:100%;height:44px;border-radius:14px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:800;color:var(--ink-2);margin-top:8px}
@media (min-width:760px){.bigbtn,.ghostbtn,.qnext{max-width:460px;display:block;margin-left:auto;margin-right:auto}}
@media (min-width:760px){
  .fcard,.qwrap,.tbox,.empty,.sbar,.chips,.pbar,.fc-act,.fc-nav{max-width:660px;margin-left:auto;margin-right:auto}
  .chips{justify-content:flex-start}
  .fc-w{font-size:32px}
}

/* ── 비교 도식 ── */
.cmpgrid{display:grid;grid-template-columns:1fr;gap:10px}
.cmp{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.cmp h4{margin:0 0 9px;font-size:13px;font-weight:900;letter-spacing:-.3px}
.cmp .row{display:flex;align-items:stretch;gap:8px}
.cmp .side{flex:1;min-width:0;border-radius:12px;padding:9px 10px;font-size:12px;line-height:1.55;font-weight:700;word-break:keep-all}
.cmp .side.a{background:var(--lav-2);border:1px solid var(--line)}
.cmp .side.b{background:var(--mint-bg);border:1px solid #C7EEDF}
.cmp .side b{display:block;font-size:12.5px;font-weight:900;color:var(--purple);margin-bottom:2px}
.cmp .side.b b{color:var(--mint-ink)}
.cmp .arw{flex:0 0 20px;text-align:center;font-size:15px;color:var(--ink-3);font-weight:900;align-self:center}
.cmp .note{margin:9px 0 0;font-size:11.5px;color:var(--ink-3);font-weight:700;line-height:1.5;word-break:keep-all}

@media (max-width:560px){
  .cmp .row{flex-direction:column}
  .cmp .arw{transform:rotate(90deg);align-self:center;margin:-2px 0}
}
@media (max-width:430px){
  .hero h1{font-size:24px}
  .fc-w{font-size:26px}
  .qword{font-size:26px}
  .fc-art{width:92px;height:92px}
}
@media print{body{display:none!important}}
</style>
<style>
/* ================= 돋움 자료 보호 레이어 (자동 삽입) ================= */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,option,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
body.dm-locked{overflow:hidden}

/* --- 워터마크: 화면 전체 고정 오버레이 --- */
.dm-wm{position:fixed;inset:0;z-index:2147482000;pointer-events:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22360%22%20height%3D%22210%22%3E%3Cg%20fill%3D%22%234A3F6B%22%20font-family%3D%22-apple-system%2CHelvetica%2CArial%2Csans-serif%22%20font-size%3D%2213%22%20font-weight%3D%22700%22%3E%3Ctext%20transform%3D%22translate%2814%2C70%29%20rotate%28-23%29%22%3E%EB%8F%8B%EC%9B%80%EA%B5%AD%EC%96%B4%EB%85%BC%EC%88%A0%ED%95%99%EC%9B%90%20%C2%B7%20%EC%99%B8%EB%B6%80%20%EC%9C%A0%EC%B6%9C%20%EA%B8%88%EC%A7%80%3C%2Ftext%3E%3Ctext%20transform%3D%22translate%28196%2C168%29%20rotate%28-23%29%22%3E%EB%8F%8B%EC%9B%80%EA%B5%AD%EC%96%B4%EB%85%BC%EC%88%A0%ED%95%99%EC%9B%90%20%C2%B7%20%EC%99%B8%EB%B6%80%20%EC%9C%A0%EC%B6%9C%20%EA%B8%88%EC%A7%80%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-repeat:repeat;background-position:0 0;background-size:360px 210px;
  opacity:.055;mix-blend-mode:multiply}
@media (max-width:520px){.dm-wm{opacity:.05;background-size:300px 175px}}

/* --- 잠금 화면 --- */
body.dm-locked > .app,body.dm-locked > .footer-fixed,body.dm-locked > .sheet-mask,body.dm-locked > .toast{display:none!important}
.dm-lock{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:22px 18px;
  background:radial-gradient(1100px 620px at 50% -12%,#F8F6FD 0%,#EFEAF9 42%,#DFD7F0 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#2B2438;opacity:0;transition:opacity .18s ease;overflow:auto}
.dm-lock.dm-on{opacity:1}
.dm-card{width:100%;max-width:378px;background:#fff;border:1px solid #E4DEF0;border-radius:24px;
  padding:26px 22px 20px;box-shadow:0 20px 60px rgba(76,60,120,.18);text-align:center}
.dm-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;color:#6E5B9A;
  background:#F1ECFA;border-radius:999px;padding:5px 12px}
.dm-logo{margin:15px 0 3px;font-size:23px;font-weight:900;letter-spacing:-.7px;color:#2B2438}
.dm-title{font-size:13.5px;font-weight:800;color:#6E5B9A;letter-spacing:-.1px}

.dm-sub b{color:#6E5B9A;font-weight:800}

})();

function b64bytes(s){
  var bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesB64(u){
  var s = "", c = 0x8000;
  for(var i=0;i<u.length;i+=c) s += String.fromCharCode.apply(null, u.subarray(i, i + c));
  return btoa(s);
}

/* --- Web Crypto 경로 --- */
function deriveAes(pw){
  var data = new TextEncoder().encode(pw);
  return subtle.importKey("raw", data, "PBKDF2", false, ["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2", salt:b64bytes(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function aesOpen(key){
  return subtle.decrypt({name:"AES-GCM", iv:b64bytes(ENC.iv)}, key, b64bytes(ENC.ct)).then(function(buf){
    return new TextDecoder("utf-8").decode(new Uint8Array(buf));
  });
}
function aesImport(rawB64){ return subtle.importKey("raw", b64bytes(rawB64), {name:"AES-GCM"}, false, ["decrypt"]); }

function fnv1a(s){

function remember(mode, val){
  try{ sessionStorage.setItem(STORE, JSON.stringify({m:mode, k:val, t:Date.now()})); }catch(e){}
}
function forget(){ try{ sessionStorage.removeItem(STORE); }catch(e){} }

function openWith(value){
  var plain = (value && value.indexOf("DM1|") === 0) ? value.slice(4) : null;
  return plain;
}

function attempt(pw){
  var chain = Promise.resolve(null);
  if(subtle){
    chain = deriveAes(pw).then(function(key){
      return aesOpen(key).then(function(text){
        var plain = openWith(text);
        if(!plain) throw new Error("bad magic");
        return subtle.exportKey("raw", key).then(function(raw){
          remember("aes", bytesB64(new Uint8Array(raw)));
          return plain;
        });
      });
    }).catch(function(){ return null; });
  }
  return chain.then(function(ok){
    if(ok) return ok;
    try{
      var seed = fbSeed(pw, ENC.saltHex);
      var plain = openWith(fbOpen(seed, ENC.fb.ct));
      if(plain){ remember("fb", seed.join(",")); return plain; }
    }catch(e){}
    return null;
  });
}

function restore(){
  var raw = null;
  try{ raw = sessionStorage.getItem(STORE); }catch(e){ return Promise.resolve(null); }
  if(!raw) return Promise.resolve(null);
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ forget(); return Promise.resolve(null); }
  if(o && o.m === "aes" && subtle){
    return aesImport(o.k).then(aesOpen).then(function(text){
      var plain = openWith(text);
      if(!plain) throw new Error("bad");
      return plain;
    }).catch(function(){ forget(); return null; });
  }
  if(o && o.m === "fb"){
    try{
      var plain = openWith(fbOpen(fbSeedFromCsv(o.k), ENC.fb.ct));
      if(plain) return Promise.resolve(plain);
    }catch(e){}
  }
  forget();
  return Promise.resolve(null);
}

/* ── 공통 상태·저장 ─────────────────────────────────────────── */
var LS = 'dodum_prehigh_v1';
var CATS = ['한자성어', '개념어', '옛말', '시어', '소설어휘'];
var WKLAB = { 0: '전체', 1: '1주차', 2: '2주차', 3: '3주차', 4: '4주차' };

DATA.words.forEach(function (w, i) { w.i = i; });
DATA.tests.forEach(function (t) {
  t.items.forEach(function (it) { it.id = 'w' + t.wk + 'q' + it.n; it.wk = t.wk; });
});

var MEM = { seen: {}, hard: {}, quizBest: {}, testBest: {}, wrongW: [], wrongI: [] };
function loadMem() {
  try {
    var raw = localStorage.getItem(LS);
    if (!raw) return;
    var o = JSON.parse(raw);
    for (var k in MEM) { if (o[k] !== undefined && o[k] !== null) MEM[k] = o[k]; }
  } catch (e) { }
}
function saveMem() { try { localStorage.setItem(LS, JSON.stringify(MEM)); } catch (e) { } }
loadMem();

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function wordsIn(wk) { return wk === 0 ? DATA.words.slice() : DATA.words.filter(function (w) { return w.wk === wk; }); }
function allItems() { var o = []; DATA.tests.forEach(function (t) { o = o.concat(t.items); }); return o; }
function mixedItems() {
  var out = [];
  DATA.tests.forEach(function (t) {
    [0, 6, 9, 12, 15].forEach(function (k) { if (t.items[k]) out.push(t.items[k]); });
  });
  return out;
}
function itemsIn(wk) { return wk === 0 ? mixedItems() : DATA.tests[wk - 1].items; }
function itemById(id) { var f = null; allItems().forEach(function (it) { if (it.id === id) f = it; }); return f; }
function wordByIdx(i) { return DATA.words[i]; }
function addWrongW(i) { if (MEM.wrongW.indexOf(i) < 0) MEM.wrongW.push(i); saveMem(); }
function addWrongI(id) { if (MEM.wrongI.indexOf(id) < 0) MEM.wrongI.push(id); saveMem(); }
function delWrongW(i) { MEM.wrongW = MEM.wrongW.filter(function (x) { return x !== i; }); saveMem(); }
function delWrongI(id) { MEM.wrongI = MEM.wrongI.filter(function (x) { return x !== id; }); saveMem(); }

var S = { scr: 'home', wk: 0 };
var $ = function (id) { return document.getElementById(id); };

/* ── 헤더 ───────────────────────────────────────────────── */
var TITLES = { home: '고전어휘 퀴즈', cards: '단어 암기 카드', quiz: '뜻 고르기 퀴즈', test: '실전 테스트', wrong: '오답 노트', cmp: '헷갈림 비교 도식' };

function renderWeeks() {
  var h = '';
  [1, 2, 3, 4, 0].forEach(function (k) {
    h += '<button class="wk' + (S.wk === k ? ' on' : '') + '" data-act="wk" data-val="' + k + '">' + WKLAB[k] + '</button>';
  });
  $('weeks').innerHTML = h;
}

function setWk(v) {
  S.wk = v;
  renderWeeks();
  if (S.scr === 'cards') { C.i = 0; C.rev = false; }
  if (S.scr === 'quiz') { startQuiz(); }
  if (S.scr === 'test') { T.active = false; T.done = false; T.list = []; }
  render();
}

function render() {
  $('hdrTitle').textContent = TITLES[S.scr] || '고전어휘 퀴즈';
  var html = '';
  if (S.scr === 'home') html = viewHome();
  else if (S.scr === 'cards') html = viewCards();
  else if (S.scr === 'quiz') html = viewQuiz();
  else if (S.scr === 'test') html = viewTest();
  else if (S.scr === 'wrong') html = viewWrong();
  else if (S.scr === 'cmp') html = viewCmp();
  $('screen').innerHTML = html;
  window.scrollTo(0, 0);
}

/* ── 홈 ─────────────────────────────────────────────────── */
function viewHome() {
  var totalW = DATA.words.length, totalI = allItems().length;
  var seen = 0, hard = 0;
  for (var k in MEM.seen) if (MEM.seen[k]) seen++;
  for (var k2 in MEM.hard) if (MEM.hard[k2]) hard++;
  var wn = MEM.wrongW.length + MEM.wrongI.length;
  var scopeW = wordsIn(S.wk).length;
  var h = '';
  h += '<section class="hero">';
  h += '<h1>고전어휘, <em>그림으로</em> 외우기</h1>';
  h += '<p>한자성어 · 개념어 · 고전 어휘 — <b>' + WKLAB[S.wk] + ' ' + scopeW + '단어</b>를 그림과 꿀팁으로</p>';
  h += '<div class="statrow">';
  h += '<div class="stat"><b>' + totalW + '</b><span>전체 단어</span></div>';
  h += '<div class="stat"><b>' + totalI + '</b><span>실전 문항</span></div>';
  h += '<div class="stat"><b>' + seen + '</b><span>외운 카드</span></div>';
  h += '</div></section>';

  h += '<div class="sec-h"><h2>학습 모드</h2><span class="hint">' + WKLAB[S.wk] + ' 기준</span></div>';
  h += '<div class="modes">';
  h += modeCard('cards', MOTIF.sprout, '단어 암기 카드', '그림 → 단어 → 뜻 · 💡 암기 꿀팁까지', scopeW + '개', '');
  h += modeCard('quiz', MOTIF.bulb, '뜻 고르기 퀴즈', '4지선다 · 고전어휘↔현대어 양방향', '20문항', '');
  h += modeCard('test', MOTIF.flag, '실전 테스트', '실제 시험 유형 그대로 · 주차별 ' + DATA.tests[0].items.length + '문항', itemsIn(S.wk).length + '문항', '');
  h += modeCard('wrong', MOTIF.magnifier, '오답 노트', '틀린 문제만 모아서 다시 풀기', wn ? wn + '개' : '비어 있음', '');
  h += '<button class="mcard wide" data-act="cmp">'
    + '<span class="ic">' + MOTIF.scales + '</span>'
    + '<span class="txt"><h3>헷갈림 비교 도식</h3>'
    + '<p>유사어·반의어, 옛 표기 ↔ 현대어를 나란히 놓고 한눈에</p></span>'
    + '<span class="tag">도식</span></button>';
  h += '</div>';
  if (hard) {
    h += '<div class="sec-h"><h2>다시 볼 단어</h2><span class="hint">헷갈림 ' + hard + '개</span></div>';
    h += '<button class="bigbtn" data-act="hardonly">헷갈리는 단어만 모아 보기</button>';
  }
  return h;
}
function modeCard(act, icon, title, sub, tag, extra) {
  return '<button class="mcard" data-act="' + act + '">'
    + '<span class="ic">' + icon + '</span>'
    + '<span class="txt"><h3>' + title + '</h3><p>' + sub + '</p></span>'
    + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</button>';
}

/* ── 암기 카드 ──────────────────────────────────────────── */
var C = { list: [], i: 0, rev: false, cat: 'all', only: false };

function cardPool() {
  return DATA.words.filter(function (w) {
    if (S.wk !== 0 && w.wk !== S.wk) return false;
    if (C.cat !== 'all' && w.cat !== C.cat) return false;
    if (C.only && !MEM.hard[w.i]) return false;
    return true;
  });
}
function viewCards() {
  C.list = cardPool();
  if (C.i >= C.list.length) C.i = Math.max(0, C.list.length - 1);
  var h = '';
  h += '<div class="sbar"><button class="bk" data-act="home">← 처음으로</button>'
    + '<div class="ttl">' + WKLAB[S.wk] + ' 단어 암기</div>'
    + '<div class="cnt">' + (C.list.length ? (C.i + 1) + ' / ' + C.list.length : '0') + '</div></div>';

  h += '<div class="chips"><button class="chip' + (C.cat === 'all' ? ' on' : '') + '" data-act="cat" data-val="all">전체</button>';
  CATS.forEach(function (c) {
    h += '<button class="chip' + (C.cat === c ? ' on' : '') + '" data-act="cat" data-val="' + c + '">' + c + '</button>';
  });
  h += '</div>';

  var hardN = 0;
  for (var k in MEM.hard) if (MEM.hard[k]) hardN++;
  h += '<div class="chips"><button class="chip' + (C.only ? ' on' : '') + '" data-act="only">🔁 헷갈리는 단어만' + (hardN ? ' (' + hardN + ')' : '') + '</button></div>';

  if (!C.list.length) {

/* ── 뜻 고르기 퀴즈 ─────────────────────────────────────── */
var Q = { list: [], i: 0, dir: 'w2m', sel: -1, opts: [], ok: 0, bad: 0, done: false };

function startQuiz(list) {
  var pool = list ? list.slice() : wordsIn(S.wk).slice();
  shuffle(pool);
  Q.list = pool.slice(0, Math.min(20, pool.length));
  Q.i = 0; Q.ok = 0; Q.bad = 0; Q.sel = -1; Q.done = false;
  buildQ();
}
function buildQ() {
  var w = Q.list[Q.i];
  if (!w) { Q.done = true; return; }
  var scope = wordsIn(S.wk);
  var pool = scope.filter(function (x) { return x.cat === w.cat && x.i !== w.i; });
  if (pool.length < 3) pool = DATA.words.filter(function (x) { return x.cat === w.cat && x.i !== w.i; });
  shuffle(pool);
  var opts = [w];
  for (var i = 0; i < pool.length && opts.length < 4; i++) {
    var dup = false;
    for (var j = 0; j < opts.length; j++) if (opts[j].m === pool[i].m) dup = true;
    if (!dup) opts.push(pool[i]);
  }
  if (opts.length < 4) {
    var extra = shuffle(DATA.words.slice());
    for (var k = 0; k < extra.length && opts.length < 4; k++) {
      if (extra[k].i === w.i) continue;
      var d2 = false;
      for (var m = 0; m < opts.length; m++) if (opts[m].m === extra[k].m) d2 = true;
      if (!d2) opts.push(extra[k]);
    }
  }
  Q.opts = shuffle(opts);
  Q.sel = -1;
}

function viewQuiz() {
  if (!Q.list.length) startQuiz();
  var h = '';
  if (Q.done) return viewQuizEnd();
  var w = Q.list[Q.i];
  if (!w) { Q.done = true; return viewQuizEnd(); }
  var total = Q.list.length;
  h += '<div class="sbar"><button class="bk" data-act="home">← 처음으로</button>'
    + '<div class="ttl">' + WKLAB[S.wk] + ' 뜻 고르기</div>'
    + '<div class="cnt">' + (Q.i + 1) + ' / ' + total + '</div></div>';
  h += '<div class="pbar"><i style="width:' + Math.round((Q.i) / total * 100) + '%"></i></div>';
  h += '<div class="qwrap">';
  h += '<div class="qdir">'
    + '<button class="' + (Q.dir === 'w2m' ? 'on' : '') + '" data-act="qdir" data-val="w2m">고전어휘 → 뜻</button>'
    + '<button class="' + (Q.dir === 'm2w' ? 'on' : '') + '" data-act="qdir" data-val="m2w">뜻 → 고전어휘</button></div>';
  if (Q.dir === 'w2m') {
    h += '<div class="qlead">이 고전어휘의 뜻은?</div>';
    h += '<div class="qword">' + esc(w.w) + '</div>';
  } else {
    h += '<div class="qlead">이 뜻에 해당하는 고전어휘는?</div>';
    h += '<div class="qword small">' + esc(w.m) + '</div>';
  }
  Q.opts.forEach(function (o, idx) {
    var cls = 'opt';
    var num = String.fromCharCode(9312 + idx);
    if (Q.sel >= 0) {
      if (o.i === w.i) cls += ' ok';
      else if (idx === Q.sel) cls += ' no';
    }
    h += '<button class="' + cls + '" data-act="opt" data-val="' + idx + '">'
      + '<span class="num">' + num + '</span><span>' + esc(Q.dir === 'w2m' ? o.m : o.w) + '</span></button>';
  });
  if (Q.sel >= 0) {
    var right = Q.opts[Q.sel] && Q.opts[Q.sel].i === w.i;
    h += '<div class="fb ' + (right ? 'ok' : 'no') + '">';
    h += right ? '<b>정답입니다.</b> ' : '<b>정답은 ' + esc(w.w) + ' — ' + esc(w.m) + '</b><br>';
    if (w.t) h += '💡 <b>암기 꿀팁</b> ' + esc(w.t);
    h += '</div>';
  }
  h += '<button class="qnext" data-act="qnext"' + (Q.sel < 0 ? ' disabled' : '') + '>'
    + (Q.i + 1 >= total ? '결과 보기' : '다음 문항 →') + '</button>';
  h += '</div>';
  return h;
}

function viewQuizEnd() {
  var total = Q.list.length || 1;
  var pct = Math.round(Q.ok / total * 100);
  var msg = pct >= 90 ? '최고예요! 이 주차는 거의 다 외웠어요.' : pct >= 70 ? '좋아요. 틀린 단어만 다시 보면 완성!' : '괜찮아요. 오답 노트로 한 번 더!';
  var h = '<div class="sbar"><button class="bk" data-act="home">← 처음으로</button><div class="ttl">퀴즈 결과</div></div>';
  h += '<div class="score"><div class="lab">' + WKLAB[S.wk] + ' 뜻 고르기</div>'
    + '<div class="big">' + Q.ok + '<small> / ' + Q.list.length + '</small></div>'
    + '<div class="msg">' + pct + '% · ' + msg + '</div></div>';
  h += '<div style="margin-top:14px"><button class="bigbtn" data-act="qrestart">같은 범위로 다시 풀기</button>';
  if (MEM.wrongW.length) h += '<button class="ghostbtn" data-act="wrong">오답 노트 보기 (' + MEM.wrongW.length + '개 단어)</button>';
  h += '<button class="ghostbtn" data-act="home">학습 모드로 돌아가기</button></div>';
  return h;
}

var T = { list: [], i: 0, done: false, active: false, res: {}, sel: -1, graded: false, showed: false, wk: 0, retry: false };

      + (it.tip ? '<br><br>💡 <b>암기 꿀팁</b> ' + esc(it.tip) : '') + '</div>';
    h += '<div class="selfg"><button class="y" data-act="tgrade" data-val="1">맞았어요</button>'

      + '<div class="side b"><b>' + esc(c.b[0]) + '</b>' + esc(c.b[1]) + '</div>'
      + '</div>';
    if (c.note) h += '<p class="note">' + esc(c.note) + '</p>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ── 이벤트 ─────────────────────────────────────────────── */
function clampIdx(list, i) { return Math.max(0, Math.min(i, list.length - 1)); }

function handle(act, val) {
  var w, it, idx;
  switch (act) {
    case 'home': S.scr = 'home'; render(); break;
    case 'cards': S.scr = 'cards'; C.i = 0; C.rev = false; C.list = cardPool(); render(); break;
    case 'hardonly': C.only = true; S.scr = 'cards'; C.i = 0; C.rev = false; render(); break;
    case 'quiz': S.scr = 'quiz'; startQuiz(); render(); break;
    case 'qrestart': startQuiz(); render(); break;
    case 'test': S.scr = 'test'; T.active = false; T.done = false; T.list = []; render(); break;
    case 'tstart': startTest(itemsIn(S.wk), S.wk); render(); break;
    case 'twrong':
      var ws = T.list.filter(function (x) { return !T.res[x.id]; });
      if (ws.length) { var wk0 = T.wk; startTest(ws, wk0); T.retry = true; render(); }
      break;
    case 'testexit': T.active = false; S.scr = 'home'; render(); break;
    case 'wrong': WR.confirm = false; S.scr = 'wrong'; render(); break;
    case 'cmp': S.scr = 'cmp'; render(); break;
    case 'wk': setWk(parseInt(val, 10)); break;

    case 'cat': C.cat = val; C.i = 0; C.rev = false; render(); break;
    case 'only': C.only = !C.only; C.i = 0; C.rev = false; render(); break;
    case 'flip': C.rev = !C.rev; render(); break;
    case 'ok':
      w = C.list[C.i];
      if (w) { MEM.seen[w.i] = 1; delete MEM.hard[w.i]; saveMem(); }
      C.rev = false;
      if (C.i < cardPool().length - 1) C.i++;
      render(); break;
    case 'hard':
      w = C.list[C.i];
      if (w) { MEM.hard[w.i] = 1; delete MEM.seen[w.i]; saveMem(); }
      C.rev = false;
      if (C.i < cardPool().length - 1) C.i++;
      render(); break;
    case 'prev': C.rev = false; C.i = clampIdx(C.list, C.i - 1); render(); break;
    case 'next': C.rev = false; C.i = clampIdx(C.list, C.i + 1); render(); break;

    case 'qdir': Q.dir = val; Q.sel = -1; render(); break;
    case 'opt':
      if (Q.sel >= 0) break;
      w = Q.list[Q.i];
      idx = parseInt(val, 10);
      if (!w || !Q.opts[idx]) break;
      Q.sel = idx;
      if (Q.opts[idx].i === w.i) { Q.ok++; delWrongW(w.i); }
      else { Q.bad++; addWrongW(w.i); }
      render(); break;
    case 'qnext':
      Q.i++;
      if (Q.i >= Q.list.length) { Q.done = true; }
      else { buildQ(); }
      render(); break;

    case 'tchoice': if (T.graded) break; T.sel = parseInt(val, 10); render(); break;
    case 'tcheck':
      it = T.list[T.i];
      T.graded = true;
      var right = (T.sel === it.ans);
      T.res[it.id] = right;
      if (right) delWrongI(it.id); else addWrongI(it.id);
      render(); break;
    case 'tshow': T.showed = true; render(); break;
    case 'tgrade':
      it = T.list[T.i];
      T.graded = true;
      var ok2 = (val === '1');
      T.res[it.id] = ok2;
      if (ok2) delWrongI(it.id); else addWrongI(it.id);
      render(); break;
    case 'tnext':
      T.i++; T.sel = -1; T.graded = false; T.showed = false;
      if (T.i >= T.list.length) T.done = true;
      render(); break;

    case 'wdelI': delWrongI(val); render(); break;
    case 'wdelW': delWrongW(parseInt(val, 10)); render(); break;
    case 'wclear':
      if (WR.confirm) { MEM.wrongI = []; MEM.wrongW = []; WR.confirm = false; saveMem(); }
      else { WR.confirm = true; }
      render(); break;
    case 'wretryI':
      var its = MEM.wrongI.map(itemById).filter(Boolean);
      if (its.length) { S.scr = 'test'; startTest(its, 0); T.retry = true; render(); }
      break;
    case 'wretryW':
      var wds = MEM.wrongW.map(wordByIdx).filter(Boolean);
      if (wds.length) { S.scr = 'quiz'; startQuiz(wds); render(); }
      break;
  }
}
