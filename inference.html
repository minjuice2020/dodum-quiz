<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추론하며 읽기 (광고 · 유튜브) · 돋움국어논술학원</title>
<style>

:root{
  --purple:#6E5B9A; --purple-dark:#56457F; --purple-soft:#8A78B4;
  --lav:#ECE8F6; --lav-2:#F7F5FC; --lav-3:#DCD4EE;
  --ink:#2B2438; --ink-2:#5B5468; --ink-3:#8C859B;
  --mint:#7ED9C3; --mint-ink:#1F5F4E;
  --gold:#FFD97A; --gold-ink:#7A5B00;
  --green:#2E9E6B; --green-bg:#E7F6EE;
  --red:#D24B4B; --red-bg:#FBEAEA;
  --paper:#FFFFFF; --bg:#F3F0FA;
  --line:#E4DEF0;
  --shadow:0 8px 24px rgba(76,60,120,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:74px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:14px 16px 0}

/* ---------- top player bar ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:10px 0 12px;background:linear-gradient(180deg,var(--bg) 70%,rgba(243,240,250,0))}
.player{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:2px solid #1c1a22;border-radius:999px;
  padding:7px 8px 7px 7px;box-shadow:var(--shadow);
}
.play{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:13px;display:grid;place-items:center;
  box-shadow:0 3px 8px rgba(110,91,154,.35);transition:transform .15s;
}
.play:active{transform:scale(.94)}
.play.playing{background:var(--purple-dark)}
.track{flex:1;min-width:0;font-weight:800;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .np{font-size:10.5px;letter-spacing:.4px;color:var(--ink-3);font-weight:800;margin-right:4px}
.ctrl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#222;font-weight:700;flex:0 0 auto}
.ctrl .heart{color:var(--red)}
.pill-mint{
  flex:0 0 auto;background:var(--mint);color:var(--mint-ink);
  font-weight:900;font-size:12px;padding:4px 12px;border-radius:999px;border:1.5px solid #1c1a22;
}
@media(max-width:520px){
  .ctrl{gap:3px;font-size:10px}
  .ctrl .ar{display:none}
  .track{font-size:10px}
  .track .np{font-size:7.5px;margin-right:2px}
  .pill-mint{font-size:10px;padding:4px 7px}
}

/* ---------- hero ---------- */
.hero{padding:18px 4px 6px}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.2px;color:var(--purple);display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;word-break:keep-all}
.brand .brand-t{font-weight:800;color:var(--ink-3);white-space:nowrap}
.hero h1{margin:4px 0 0;font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.2;word-break:keep-all}
.hero .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.badge-dark{background:#241F33;color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:8px;letter-spacing:.4px}
.hero .sub{color:var(--ink-2);font-size:13.5px;margin-top:8px;word-break:keep-all}
.hero .sub b{color:var(--purple)}

/* ---------- mode cards ---------- */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;gap:8px}
.sec-title h2{font-size:16px;margin:0;font-weight:900;letter-spacing:-.3px}
.sec-title .hint{font-size:12px;color:var(--ink-3);font-weight:700;text-align:right}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.modes{grid-template-columns:1fr}}
.mcard{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.16s;text-align:left;position:relative;overflow:hidden;
}
.mcard:hover{transform:translateY(-2px);border-color:var(--lav-3);box-shadow:0 12px 28px rgba(76,60,120,.12)}
.mcard .tag{display:flex;align-items:center;gap:7px}
.mcard .mno{background:var(--purple);color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.mcard .cnt{font-size:11.5px;color:var(--ink-3);font-weight:800}
.mcard .tt{font-size:16px;font-weight:900;letter-spacing:-.4px;line-height:1.35}
.mcard .dd{font-size:12.5px;color:var(--ink-2);font-weight:700;line-height:1.55;word-break:keep-all}
.bar{height:7px;border-radius:99px;background:var(--lav);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple-soft),var(--purple));border-radius:99px;transition:width .4s}
.mcard .meta{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.mcard .meta b{color:var(--purple)}

/* 분야별 특성 배너 */
.fband{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,#FFFFFF,#F6F2FE);
  border:2px solid var(--purple);border-radius:var(--radius);
  padding:14px 16px;margin-top:14px;box-shadow:0 8px 20px rgba(110,91,154,.14);
}
.fband .fi{font-size:22px}
.fband .ft{flex:1;min-width:180px}
.fband .ft b{display:block;font-size:15px;font-weight:900;letter-spacing:-.4px}
.fband .ft span{font-size:12.5px;color:var(--ink-2);font-weight:700;word-break:keep-all}
.fband .fgo{background:var(--purple);color:#fff;font-weight:900;font-size:13px;padding:10px 15px;border-radius:12px;white-space:nowrap}
@media(max-width:600px){
  .fband{gap:8px}
  .fband .fi{display:none}
  .fband .ft{flex:1 1 100%}
  .fband .fgo{flex:1 1 100%;text-align:center}
}

/* ---------- shared ---------- */
.qtop{display:flex;align-items:center;gap:9px;margin:2px 2px 12px}
.iconbtn{
  width:36px;height:36px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);box-shadow:var(--shadow);flex:0 0 auto;font-weight:900;
}
.qtop .ttl{font-weight:900;font-size:16px;letter-spacing:-.4px;flex:1;min-width:0}
.qtop .ttl small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:0}
.tabrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;-ms-overflow-style:none;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:12.5px;font-weight:900;color:var(--ink-3);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;letter-spacing:-.2px}
.tab.on{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 12px rgba(110,91,154,.25)}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 12px}
.fchip{font-size:11.5px;font-weight:900;color:var(--ink-2);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px}
.fchip.on{background:var(--lav);border-color:var(--purple);color:var(--purple-dark)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px}
.card + .card{margin-top:12px}
.btn{
  border-radius:12px;padding:11px 18px;font-weight:900;font-size:14px;letter-spacing:-.2px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-2);transition:.14s;
}
.btn:hover{border-color:var(--lav-3)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 6px 16px rgba(110,91,154,.28)}
.btn.primary:hover{background:var(--purple-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.grow{flex:1;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.qnav{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#241F33;color:#fff;font-size:13px;font-weight:800;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--ink-3);font-weight:700;font-size:12.5px}

/* ---------- flashcard ---------- */
.fcswitch{display:flex;gap:6px;background:var(--lav-2);border:1.5px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.fcswitch button{flex:1;font-size:12.5px;font-weight:900;color:var(--ink-3);padding:8px 6px;border-radius:9px;letter-spacing:-.3px}
.fcswitch button.on{background:#fff;color:var(--purple);box-shadow:0 2px 8px rgba(76,60,120,.12)}
.fcard{
  width:100%;min-height:250px;background:#fff;border:1.5px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);padding:20px 20px 18px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;
}
.fcard .ftag{position:absolute;top:14px;left:16px;display:flex;gap:6px;align-items:center}
.pill{background:var(--lav);color:var(--purple);border:1px solid var(--lav-3);font-weight:900;font-size:11px;padding:3px 9px;border-radius:999px}
.pill.gold{background:#FFF3D1;color:var(--gold-ink);border-color:#F3DE9E}
.pill.mint{background:#E2F7F0;color:var(--mint-ink);border-color:#B7E8DA}
.fcard .fw{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.25;word-break:keep-all}
.fcard .fm{font-size:19px;font-weight:800;line-height:1.6;letter-spacing:-.4px;word-break:keep-all;color:#332D40}
.fcard .fex{font-size:13px;color:var(--ink-2);font-weight:700;background:var(--lav-2);border-radius:10px;padding:8px 11px;line-height:1.6;text-align:left;width:100%}
.fcard .fsrc{font-size:11px;color:var(--ink-3);font-weight:800}
.fcard .fhint{font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:.2px}
.fcard .fstate{position:absolute;top:14px;right:16px;font-size:11px;font-weight:900}
.fcard .fstate.ok{color:var(--green)}
.fcard .fstate.ng{color:var(--red)}
.fcacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fcacts button{padding:12px 8px;border-radius:13px;font-weight:900;font-size:14px;border:1.5px solid var(--line);background:#fff}
.fcacts .ng{color:var(--red);border-color:#F0C9C9;background:var(--red-bg)}
.fcacts .ok{color:#1F7A50;border-color:#BFE5D2;background:var(--green-bg)}
.fcnav{display:flex;gap:9px;margin-top:10px;align-items:center}
.fcnav .btn{flex:1}
.fcnum{font-size:12.5px;font-weight:900;color:var(--ink-2);min-width:64px;text-align:center}
.fcnum b{color:var(--purple)}

/* ---------- choice / quiz ---------- */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qnum{background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:13px;padding:2px 10px;border-radius:7px;letter-spacing:.2px}
.typepill{margin-left:auto;background:var(--lav-2);color:var(--purple);border:1px solid var(--lav-3);font-weight:900;font-size:11.5px;padding:3px 10px;border-radius:999px}
.qinstr{font-size:12.5px;color:var(--ink-3);font-weight:700;margin:0 0 10px}
.stem{font-size:19px;font-weight:900;line-height:1.55;letter-spacing:-.4px;margin:4px 0 14px;word-break:keep-all}
.stem.small{font-size:16px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{
  display:flex;gap:10px;align-items:flex-start;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;
  font-size:14.5px;line-height:1.6;letter-spacing:-.2px;transition:.12s;color:#37313F;
}
.choice:hover{border-color:var(--lav-3);background:#FCFBFF}
.choice .no{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--lav-2);color:var(--purple);
  display:grid;place-items:center;font-size:12.5px;font-weight:900;border:1px solid var(--lav-3);margin-top:1px;
}
.choice .tx{flex:1;word-break:keep-all}
.choice.ok{border-color:var(--green);background:var(--green-bg)}
.choice.ok .no{background:var(--green);color:#fff;border-color:var(--green)}
.choice.ng{border-color:var(--red);background:var(--red-bg)}
.choice.ng .no{background:var(--red);color:#fff;border-color:var(--red)}
.fb{margin-top:14px;border-radius:13px;padding:13px 15px;font-size:13.8px;line-height:1.75;letter-spacing:-.2px}
.fb.ok{background:var(--green-bg);border:1.5px solid #BFE5D2}
.fb.ng{background:var(--red-bg);border:1.5px solid #F0C9C9}
.fb.neutral{background:var(--lav-2);border:1.5px solid var(--lav-3)}
.fb .res{font-weight:900;font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.fb.ok .res{color:#1F7A50}
.fb.ng .res{color:#B33A3A}
.fb .expl{color:#4A4356}
.fb .expl b{color:var(--purple-dark)}
.scorebar{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.progress{flex:1;height:9px;border-radius:99px;background:#E7E1F3;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#A18FC9,var(--purple));border-radius:99px;transition:width .3s}
.qcount{font-size:12.5px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.qcount b{color:var(--purple)}

/* ---------- blanks ---------- */
.bhead{display:inline-flex;align-items:center;gap:6px;background:var(--lav);color:var(--purple-dark);font-weight:900;font-size:11.5px;padding:4px 10px;border-radius:999px;margin-bottom:8px;word-break:keep-all}
.bprompt{font-size:15px;font-weight:900;letter-spacing:-.3px;margin:0 0 12px;word-break:keep-all}
.btext{font-size:15.5px;line-height:2.15;letter-spacing:-.2px;color:#332D40;word-break:keep-all}
.btext .bpart{display:block}
.btext .bpart + .bpart{margin-top:5px}
.btext .bpart + .bpart.new{margin-top:10px;padding-top:9px;border-top:1px dashed #EDE8F7}
.btext .bpart.cont{padding-left:13px;font-size:14.8px;color:#403A4C}
.blank{
  display:inline-block;min-width:74px;padding:1px 10px;margin:0 2px;border-radius:8px;
  border:1.5px dashed var(--purple-soft);background:var(--lav-2);color:var(--purple-dark);
  font-weight:900;font-size:14px;line-height:1.75;text-align:center;vertical-align:baseline;word-break:keep-all;
}
.blank.empty{color:#BBAFD6}
.blank.active{border-style:solid;border-color:var(--purple);box-shadow:0 0 0 3px rgba(110,91,154,.16)}
.blank.ok{border-style:solid;border-color:var(--green);background:var(--green-bg);color:#1F7A50}
.blank.ng{border-style:solid;border-color:var(--red);background:var(--red-bg);color:#B33A3A}
.blank.rev{border-style:solid;border-color:var(--purple);background:#fff;color:var(--purple-dark)}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--lav-3)}
.bank .wm{background:#fff;border:1.5px solid var(--lav-3);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:-.2px}
.bank .wm:active{transform:scale(.97)}
.bank .wm.used{opacity:.4;text-decoration:line-through}

/* ---------- fields (분야별 특성) ---------- */
.fieldcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:0;overflow:hidden;margin-bottom:12px}
.fchd{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1.5px solid var(--line);background:linear-gradient(180deg,#FBF9FE,#F4F0FC)}
.fchd .fno{width:24px;height:24px;border-radius:8px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.fchd .fname{font-size:15px;font-weight:900;letter-spacing:-.4px}
.fchd .fsub{font-size:11.5px;color:var(--ink-3);font-weight:800;margin-left:auto;white-space:nowrap}
.frow{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:11px 16px;border-bottom:1px solid #F0ECF7;font-size:13.5px;line-height:1.75;letter-spacing:-.2px;word-break:keep-all}
.frow:last-child{border-bottom:none}
.frow .k{font-size:11.5px;font-weight:900;color:var(--purple);background:var(--lav-2);border:1px solid var(--lav-3);border-radius:7px;padding:2px 7px;height:max-content;width:max-content}
.frow .v{color:#38313F}
@media(max-width:520px){
  .frow{grid-template-columns:1fr;gap:5px}
  .frow .k{font-size:11px}
}
.kw{
  display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:1.45em;
  background:#fff;border:1.5px dashed var(--purple-soft);border-radius:6px;
  color:var(--purple-dark);font-weight:900;font-size:12.5px;letter-spacing:1px;padding:0 7px;line-height:1.4;margin:0 2px;vertical-align:-2px;
}
.kw:active{background:var(--lav-3)}
.revealed{background:var(--green-bg);color:#1F7A50;border-radius:5px;padding:0 4px;font-weight:900}
.fcfoot{display:flex;gap:8px;padding:11px 16px;background:#FBFAFE;border-top:1px dashed var(--lav-3);flex-wrap:wrap}
.oneline{background:var(--lav-2);border:1.5px dashed var(--lav-3);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.oneline div{font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.85;word-break:keep-all}
.oneline b{color:var(--purple-dark)}

/* ---------- memo ---------- */
.memo textarea{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14px;line-height:1.7;color:#37313F;resize:vertical;background:#FBFAFE}
.memo textarea:focus{outline:none;border-color:var(--purple-soft);background:#fff}
.cond{background:var(--lav-2);border:1.5px dashed var(--lav-3);color:var(--purple);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:800;margin:0 0 10px;word-break:keep-all}
.selfcheck{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.selfcheck button{font-size:12px;font-weight:900;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink-3);background:#fff}
.selfcheck button.on{background:var(--purple);color:#fff;border-color:var(--purple)}

/* ---------- OX ---------- */
.oxlist{display:grid;gap:10px}
.oxrow{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;transition:.14s}
.oxrow:hover{border-color:var(--lav-3);transform:translateY(-1px)}
.oxrow .tn{width:26px;height:26px;border-radius:8px;background:var(--lav);color:var(--purple);display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.oxrow .tt{flex:1;min-width:0}
.oxrow .tt b{display:block;font-size:13.8px;font-weight:900;letter-spacing:-.3px}
.oxrow .tt span{font-size:11.5px;color:var(--ink-3);font-weight:800}
.minibar{display:block;width:74px;flex:0 0 74px}
.minibar .bar{display:block}
.oxcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 16px}
.oxstmt{font-size:18px;font-weight:800;line-height:1.8;letter-spacing:-.3px;margin:6px 0 18px;word-break:keep-all;color:#2B2438}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxbtn{height:88px;border-radius:16px;font-size:34px;font-weight:900;border:2px solid var(--line);background:#fff;color:var(--ink-2);transition:.14s;box-shadow:var(--shadow)}
.oxbtn.o:hover{border-color:var(--green);color:var(--green)}
.oxbtn.x:hover{border-color:var(--red);color:var(--red)}
.oxbtn.chosen.o{background:var(--green);color:#fff;border-color:var(--green)}

/* --- 복사·드래그·단축키·인쇄 차단 --- */
(function guard(){
  var editable = function(el){
    if(!el || !el.tagName) return false;
    return /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable === true;
  };
  ["contextmenu","copy","cut","dragstart","dragover","drop"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!editable(e.target)) e.preventDefault(); }, true);
  });
  document.addEventListener("selectstart", function(e){ if(!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener("keydown", function(e){
    var k = (e.key || "").toLowerCase();
    var mod = e.ctrlKey || e.metaKey;
    if(k === "f12" || k === "printscreen"){ e.preventDefault(); return; }
    if(mod && e.shiftKey && ["i","j","c","k","s","p"].indexOf(k) >= 0){ e.preventDefault(); return; }
    if(mod && !e.shiftKey && !editable(e.target) && ["c","x","s","u","p","a"].indexOf(k) >= 0){ e.preventDefault(); return; }
  }, true);
})();

/* --- 유틸 --- */
function b64bytes(s){
  var bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesB64(u){
  var s = "", c = 0x8000;
  for(var i=0;i<u.length;i+=c) s += String.fromCharCode.apply(null, u.subarray(i, i + c));
  return btoa(s);
}

/* --- Web Crypto 경로 --- */
function deriveAes(pw){
  var data = new TextEncoder().encode(pw);
  return subtle.importKey("raw", data, "PBKDF2", false, ["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2", salt:b64bytes(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function aesOpen(key){
  return subtle.decrypt({name:"AES-GCM", iv:b64bytes(ENC.iv)}, key, b64bytes(ENC.ct)).then(function(buf){
    return new TextDecoder("utf-8").decode(new Uint8Array(buf));
  });
}
function aesImport(rawB64){ return subtle.importKey("raw", b64bytes(rawB64), {name:"AES-GCM"}, false, ["decrypt"]); }

function fnv1a(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h = (h ^ s.charCodeAt(i)) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xs(s){
  var x = s[0], y = s[1], z = s[2], w = s[3];

function remember(mode, val){
  try{ sessionStorage.setItem(STORE, JSON.stringify({m:mode, k:val, t:Date.now()})); }catch(e){}
}
function forget(){ try{ sessionStorage.removeItem(STORE); }catch(e){} }

function openWith(value){
  var plain = (value && value.indexOf("DM1|") === 0) ? value.slice(4) : null;
  return plain;
}

function attempt(pw){
  var chain = Promise.resolve(null);
  if(subtle){
    chain = deriveAes(pw).then(function(key){
      return aesOpen(key).then(function(text){
        var plain = openWith(text);
        if(!plain) throw new Error("bad magic");
        return subtle.exportKey("raw", key).then(function(raw){
          remember("aes", bytesB64(new Uint8Array(raw)));
          return plain;
        });
      });
    }).catch(function(){ return null; });
  }
  return chain.then(function(ok){
    if(ok) return ok;
    try{
      var seed = fbSeed(pw, ENC.saltHex);
      var plain = openWith(fbOpen(seed, ENC.fb.ct));
      if(plain){ remember("fb", seed.join(",")); return plain; }
    }catch(e){}
    return null;
  });
}

function restore(){
  var raw = null;
  try{ raw = sessionStorage.getItem(STORE); }catch(e){ return Promise.resolve(null); }
  if(!raw) return Promise.resolve(null);
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ forget(); return Promise.resolve(null); }
  if(o && o.m === "aes" && subtle){
    return aesImport(o.k).then(aesOpen).then(function(text){
      var plain = openWith(text);
      if(!plain) throw new Error("bad");
      return plain;
    }).catch(function(){ forget(); return null; });
  }
  if(o && o.m === "fb"){
    try{
      var plain = openWith(fbOpen(fbSeedFromCsv(o.k), ENC.fb.ct));
      if(plain) return Promise.resolve(plain);
    }catch(e){}
  }
  forget();
  return Promise.resolve(null);
}

    return `<div class="bpart ${multi?'cont':''}">` + inner.map((s,idx)=>{
      if(idx%2===0){ return esc(s); }
      const n = bi++;
      const ansTxt = s.slice(2,-2);
      if(modes[n]==='reveal'){
        return `<button class="blank ${st.revealed?'rev':''}" data-rev="${n}">${st.revealed?esc(ansTxt):'정답 보기'}</button>`;
      }
      const val = st.filled[n];
      let cls = 'blank';
      if(st.graded){ cls += (val===ansTxt) ? ' ok' : ' ng'; }
      else { if(!val) cls += ' empty'; if(st.active===n) cls += ' active'; }
      return `<button class="${cls}" data-blank="${n}">${val?esc(val):'　'}</button>`;
    }).join('') + '</div>';
  }).join('');
  const bank = hasPick ? `<div class="bank">${item.bank.map(w=>{
      const used = Object.values(st.filled).indexOf(w)>=0;
      return `<button class="wm ${used?'used':''}" data-w="${esc(w)}">${esc(w)}</button>`;
    }).join('')}</div>` : '';
  const rightCnt = picks.filter(i=>st.filled[i]===item.ans[i]).length;
  const fb = (hasPick && st.graded)
    ? `<div class="fb ${rightCnt===picks.length?'ok':(rightCnt?'neutral':'ng')}">
        <div class="res">${rightCnt} / ${picks.length} 칸 정답</div>
        <div class="expl">${picks.map(i=>`· <b>${esc(item.ans[i])}</b>`).join('<br>')}</div>
      </div>` : '';
  return `${item.scene==='ytad'?ytadHTML():''}
    <div class="bhead">${esc(item.head||'')}</div>
    <div class="bprompt">${esc(item.prompt||'')}</div>
    <div class="btext">${html}</div>
    ${bank}
    ${item.method?`<div class="tip">🔎 ${esc(item.method)}${item.tip?'<br>💡 '+esc(item.tip):''}</div>`:(item.tip?`<div class="tip">💡 ${esc(item.tip)}</div>`:'')}
    <div class="qnav">
      ${hasPick?`<button class="btn primary" data-grade="${item.id}" ${st.graded?'disabled':''}>채점하기</button>`:''}
      ${hasRev?`<button class="btn ${hasPick?'':'primary'}" data-revbtn="${item.id}">${st.revealed?'다시 가리기':'정답 보기'}</button>`:''}
      ${hasPick?`<button class="btn" data-retry="${item.id}">다시 풀기</button>`:''}
    </div>
    ${fb}`;
}
function bindBlank(item, rerender){
  const st = blankSt(item.id);
  document.querySelectorAll('[data-blank]').forEach(el=>{
    el.onclick = ()=>{ if(st.graded) return; const n=+el.dataset.blank;
      if(st.filled[n]) delete st.filled[n];
      st.active=n; rerender(); };
  });
  document.querySelectorAll('[data-w]').forEach(el=>{
    el.onclick = ()=>{ if(st.graded) return; let t=st.active;
      if(t===null||t===undefined||st.filled[t]||pickIdx(item).indexOf(t)<0) t=firstEmptyPick(item, st);
      if(t===null||t===undefined) return;
      st.filled[t]=el.dataset.w; st.active=null; rerender(); };
  });
  const g = document.querySelector('[data-grade]');
  if(g) g.onclick = ()=>{
    st.graded = true;
    const picks = pickIdx(item);
    const right = picks.filter(i=>st.filled[i]===item.ans[i]).length;
    S.bl[item.id] = right===picks.length ? 1 : 2; save(); rerender();
  };
  const rt = document.querySelector('[data-retry]');
  if(rt) rt.onclick = ()=>{ PS[item.id]={filled:{},graded:false,revealed:st.revealed,active:null}; rerender(); };
  document.querySelectorAll('[data-rev]').forEach(rv=>{
    rv.onclick = ()=>{ st.revealed = true; S.bl[item.id]=S.bl[item.id]||1; save(); rerender(); };
  });
  const rb = document.querySelector('[data-revbtn]');
  if(rb) rb.onclick = ()=>{ st.revealed = !st.revealed; if(st.revealed){ S.bl[item.id]=S.bl[item.id]||1; save(); } rerender(); };
}

  const q = DATA.quiz[QZ.i];
  const graded = QZ.graded;

  const allRight = right===q.opts.length && Object.keys(QZ.picked).length>0 && q.opts.every((o,idx)=>(!!QZ.picked[idx])===o.ok);

      else if(!o.ok && QZ.picked[idx]) cls += ' ng';
    }
    return `<button class="${cls}" data-opt="${idx}" ${graded?'disabled':''}>
      <span class="no">${idx+1}</span>

    <div class="choices">${opts}</div>
    ${graded?`<div class="fb ${allRight?'ok':'ng'}">
      <div class="res">${allRight?'✓ 정답':'✗ 오답'} · 맞게 판정한 선지 ${right} / ${q.opts.length}</div>
      <div class="expl">정답 선지 <b>${q.opts.map((o,i)=>o.ok?CN[i]:'').filter(Boolean).join(' ')}</b> — 각 선지의 근거를 위에서 확인하세요.</div>

  document.getElementById('qList').onclick = ()=> go('m4');

    el.onclick = ()=>{ const i=+el.dataset.opt; if(QZ.graded) return; QZ.picked[i]=!QZ.picked[i]; const y=window.scrollY; renderQ(); window.scrollTo(0,y); };

  document.getElementById('oxWrong').onclick = ()=>{
    const w = OXALL.filter(x=>S.ox[x.g+'-'+x.n]===2).map(x=>x.g+'-'+x.n);
    if(!w.length){ toast('오답이 없어요. 먼저 OX를 풀어 보세요.'); return; }
    startOX(shuffle(w), '오답 모아 풀기');
  };
  document.querySelectorAll('[data-oxg]').forEach(el=>{
    el.onclick = ()=>{ const g=DATA.ox.find(x=>x.no===el.dataset.oxg);
      startOX(g.items.map(it=>g.no+'-'+it.n), g.title); };
  });
}
let OX = {ids:[], i:0, picked:null, right:0, wrong:0, title:'', done:false};
function startOX(ids, title){ OX = {ids:ids, i:0, picked:null, right:0, wrong:0, title:title, done:false}; window.scrollTo(0,0); renderOX(); }
function curOX(){ return OXALL.find(x=>x.g+'-'+x.n===OX.ids[OX.i]); }
function renderOX(){
  if(OX.done || OX.i>=OX.ids.length) return renderOXSummary();
  const it = curOX();
  if(!it) return renderOXSummary();
  const answered = OX.picked!==null;
  SCR.innerHTML = `
  <div class="qtop"><button class="iconbtn" id="oxBack">←</button>
    <div class="ttl">${esc(OX.title)} <small>${OX.i+1} / ${OX.ids.length}</small></div></div>
  <div class="scorebar"><div class="progress"><i style="width:${Math.round(OX.i/OX.ids.length*100)}%"></i></div>
    <div class="qcount">✓${OX.right} ✗${OX.wrong}</div></div>
  <div class="oxcard">
    <div class="qhead"><span class="qnum">${esc(it.g)}-${it.n}</span><span class="typepill">${esc(it.gtitle)}</span></div>
    <div class="oxstmt">${esc(it.stmt)}</div>
    <div class="oxbtns">
      <button class="oxbtn o ${answered?(OX.picked==='O'?(it.v==='O'?'chosen':'wrong'):(it.v==='O'?'answer':'')):''}" data-ox-pick="O" ${answered?'disabled':''}>O<span class="lb">옳다</span></button>
      <button class="oxbtn x ${answered?(OX.picked==='X'?(it.v==='X'?'chosen':'wrong'):(it.v==='X'?'answer':'')):''}" data-ox-pick="X" ${answered?'disabled':''}>X<span class="lb">틀리다</span></button>
    </div>
    ${answered?`<div class="fb ${OX.picked===it.v?'ok':'ng'}">
      <div class="res">${OX.picked===it.v?'✓ 정답':'✗ 오답'} · 이 선지는 <b style="margin-left:2px">${it.v}</b></div>
      <div class="expl">${esc(it.expl)}</div>
    </div>`:''}
  </div>
  <div class="qnav"><button class="btn ghost" id="oxHintBtn">묶음 핵심 보기</button><div style="flex:1"></div>
    <button class="btn primary" id="oxNext" ${answered?'':'disabled'}>${OX.i+1===OX.ids.length?'결과 보기':'다음 선지 →'}</button></div>
  <div id="oxHintBox" style="display:none;margin-top:10px" class="oxhint">${esc(it.hint)}</div>`;
  document.getElementById('oxBack').onclick = ()=> go('m5');
  document.querySelectorAll('[data-ox-pick]').forEach(el=>{
    el.onclick = ()=>{
      if(OX.picked!==null) return;
      OX.picked = el.dataset.oxPick;
      const correct = OX.picked===it.v;
      if(correct){ OX.right++; S.ox[it.g+'-'+it.n]=1; } else { OX.wrong++; S.ox[it.g+'-'+it.n]=2; }
      save(); renderOX();
    };
  });
  document.getElementById('oxHintBtn').onclick = ()=>{ const b=document.getElementById('oxHintBox'); b.style.display = b.style.display==='none'?'block':'none'; };
  document.getElementById('oxNext').onclick = ()=>{
    if(OX.i+1>=OX.ids.length){ OX.done=true; renderOXSummary(); return; }
    OX.i++; OX.picked=null; window.scrollTo(0,0); renderOX();
  };
}
function renderOXSummary(){
  const total = OX.ids.length;
  const pct = total? Math.round(OX.right/total*100):0;
  const wrongIds = OX.ids.filter(id=>S.ox[id]===2);
  SCR.innerHTML = `
  <div class="qtop"><button class="iconbtn" id="oxBack2">←</button>
    <div class="ttl">${esc(OX.title)} <small>결과</small></div></div>
  <div class="summary">
    <div class="lab">SCORE</div>
    <div class="score">${OX.right}<span> / ${total}</span></div>
    <div class="muted">정답률 ${pct}% · 오답 ${OX.wrong}개</div>
    ${wrongIds.length?`<div class="wrongs"><h3>틀린 선지</h3><div class="wlist">${wrongIds.map(id=>{
        const it=OXALL.find(x=>x.g+'-'+x.n===id); return `<span class="wchip">${esc(it.g)}-${it.n}</span>`; }).join('')}</div></div>
      <div class="qnav" style="justify-content:center"><button class="btn primary" id="againWrong">이 오답 다시 풀기</button></div>`:
      `<div class="fb ok" style="text-align:left"><div class="res">✓ 전부 정답</div><div class="expl">이 묶음의 함정 선지를 모두 잡았습니다.</div></div>`}
    <div class="qnav" style="justify-content:center">
      <button class="btn" id="toG">묶음 목록</button><button class="btn" id="toHome">홈으로</button>
    </div>
  </div>`;
  document.getElementById('oxBack2').onclick = ()=> go('m5');
  document.getElementById('toG').onclick = ()=> go('m5');
  document.getElementById('toHome').onclick = ()=> go('home');
  const ag = document.getElementById('againWrong');
  if(ag) ag.onclick = ()=> startOX(shuffle(wrongIds), '오답 다시 풀기');
}

/* ============ mode 6 : 서술형 ============ */
function renderM6(){
  const cards = DATA.memos.map(m=>{
    const st = S.memo[m.id] || {};
    return `<div class="card memo" style="margin-top:10px">
      <div class="qhead"><span class="qnum">${esc(m.src)}</span><span class="typepill">서술형</span></div>
      <div class="bprompt">${esc(m.q)}</div>
      <div class="cond">${esc(m.cond)}</div>
      <textarea data-memo="${m.id}" placeholder="먼저 내 답을 써 보세요. (자동 저장)">${esc(st.text||'')}</textarea>
      <div class="selfcheck"><button data-reveal="${m.id}">${st.show?'예시 답안 가리기':'예시 답안 보기'}</button></div>
      ${st.show?`<div class="fb neutral"><div class="res">예시 답안</div><div class="expl">${esc(m.a)}</div></div>
        <div class="selfcheck">
          <button data-self="${m.id}" data-v="3" class="${st.self===3?'on':''}">○ 다 맞음</button>
          <button data-self="${m.id}" data-v="2" class="${st.self===2?'on':''}">△ 일부</button>
          <button data-self="${m.id}" data-v="1" class="${st.self===1?'on':''}">× 못 씀</button>
        </div>`:''}
    </div>`;
  }).join('');
  const done = DATA.memos.filter(m=>(S.memo[m.id]||{}).show).length;
  SCR.innerHTML = `
  <div class="qtop"><button class="iconbtn" id="back">←</button>
    <div class="ttl">⑥ 서술형 모범 답안 <small>조건을 모두 지켜야 만점 · ${done}/${DATA.memos.length} 확인</small></div></div>
  <div class="muted" style="margin:0 2px 8px">〈조건〉에 적힌 말이 빠지면 그 문항은 0점입니다. 내 답을 쓴 뒤 예시 답안과 비교하고 스스로 채점하세요.</div>
  ${cards}`;
  document.getElementById('back').onclick = ()=> go('home');
  document.querySelectorAll('[data-memo]').forEach(el=>{
    el.oninput = ()=>{ const id=el.dataset.memo; S.memo[id]=S.memo[id]||{}; S.memo[id].text=el.value; save(); };
  });
  document.querySelectorAll('[data-reveal]').forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.reveal; S.memo[id]=S.memo[id]||{}; S.memo[id].show=!S.memo[id].show; save(); const y=window.scrollY; renderM6(); window.scrollTo(0,y); };
  });
  document.querySelectorAll('[data-self]').forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.self, v=+el.dataset.v; S.memo[id]=S.memo[id]||{}; S.memo[id].self=v; save(); const y=window.scrollY; renderM6(); window.scrollTo(0,y); };
  });
}

/* --- 잠금 화면 입력 처리 --- */
if(document.getElementById("dmForm")){
  document.getElementById("dmForm").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = (pwEl && pwEl.value ? pwEl.value : "").trim();
    if(!pw){ say("입장 비밀번호를 입력해 주세요."); if(pwEl) pwEl.focus(); return; }
    say("");
    if(btnEl){ btnEl.disabled = true; btnEl.textContent = "확인 중…"; }
    Promise.resolve(attempt(pw)).then(function(plain){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = "들어가기"; }
      if(!plain){
        say("비밀번호가 올바르지 않습니다. 다시 확인해 주세요.");
        if(pwEl){ pwEl.value = ""; pwEl.focus(); }
        return;
      }
      boot(plain);
    }).catch(function(){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = "들어가기"; }
      say("확인 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.");
    });
  });
  if(pwEl) pwEl.addEventListener("input", function(){ say(""); });
}
