<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동백꽃 유형별 퀴즈 · 돋움국어논술학원</title>
<style>
:root{
  --purple:#6E5B9A; --purple-dark:#56457F; --purple-soft:#8A78B4;
  --lav:#ECE8F6; --lav-2:#F7F5FC; --lav-3:#DCD4EE;
  --ink:#2B2438; --ink-2:#5B5468; --ink-3:#8C859B;
  --mint:#7ED9C3; --mint-ink:#1F5F4E;
  --gold:#FFD97A; --gold-ink:#7A5B00;
  --green:#2E9E6B; --green-bg:#E7F6EE;
  --red:#D24B4B; --red-bg:#FBEAEA;
  --paper:#FFFFFF; --bg:#F3F0FA;
  --line:#E4DEF0;
  --shadow:0 8px 24px rgba(76,60,120,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:34px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:14px 16px 0}

/* ---------- top player bar ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:10px 0 12px;background:linear-gradient(180deg,var(--bg) 70%,rgba(243,240,250,0))}
.player{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:2px solid #1c1a22;border-radius:999px;
  padding:7px 8px 7px 7px;box-shadow:var(--shadow);
}
.play{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:13px;display:grid;place-items:center;
  box-shadow:0 3px 8px rgba(110,91,154,.35);transition:transform .15s;
}
.play:active{transform:scale(.94)}
.play.playing{background:var(--purple-dark)}
.track{flex:1;min-width:0;font-weight:800;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .np{font-size:10.5px;letter-spacing:.4px;color:var(--ink-3);font-weight:800;margin-right:4px}
.ctrl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#222;font-weight:700;flex:0 0 auto}
.ctrl .heart{color:var(--red)}
.pill-mint{
  flex:0 0 auto;background:var(--mint);color:var(--mint-ink);
  font-weight:900;font-size:12px;padding:4px 12px;border-radius:999px;border:1.5px solid #1c1a22;
}
@media(max-width:520px){
  .ctrl{display:none}
  .track{font-size:13px}
}

/* ---------- hero ---------- */
.hero{padding:18px 4px 6px}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.2px;color:var(--purple);display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;word-break:keep-all}
.brand .brand-t{font-weight:800;color:var(--ink-3);white-space:nowrap}
.hero h1{margin:4px 0 0;font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.2}
.hero .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.badge-dark{background:#241F33;color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:8px;letter-spacing:.4px}
.hero .sub{color:var(--ink-2);font-size:13.5px;margin-top:8px}
.hero .sub b{color:var(--purple)}

/* ---------- quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 6px}
.qbtn{
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);transition:.15s;text-align:left;
}
.qbtn:hover{border-color:var(--lav-3);transform:translateY(-1px)}
.qbtn .ic{font-size:16px}
.qbtn .t{font-weight:900;font-size:14.5px;letter-spacing:-.3px}
.qbtn .d{font-size:11.5px;color:var(--ink-3);font-weight:600}
.qbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.qbtn.primary .d{color:#DCD4EE}
@media(max-width:640px){.quick{grid-template-columns:1fr}}

/* ---------- type cards ---------- */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:16px;margin:0;font-weight:900;letter-spacing:-.3px}
.sec-title .hint{font-size:12px;color:var(--ink-3);font-weight:700}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.types{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.types{grid-template-columns:1fr}}
.tcard{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 15px 13px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;transition:.16s;text-align:left;position:relative;overflow:hidden;
}
.tcard:hover{transform:translateY(-2px);border-color:var(--lav-3);box-shadow:0 12px 28px rgba(76,60,120,.12)}
.tcard .tag{display:flex;align-items:center;gap:7px}
.tcard .tno{background:var(--purple);color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.tcard .cnt{font-size:11.5px;color:var(--ink-3);font-weight:800}
.tcard .tt{font-size:15px;font-weight:900;letter-spacing:-.4px;line-height:1.35;min-height:2.2em}
.bar{height:7px;border-radius:99px;background:var(--lav);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple-soft),var(--purple));border-radius:99px;transition:width .4s}
.tcard .meta{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.tcard .meta b{color:var(--purple)}
.tcard.done .tno{background:var(--green)}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.iconbtn{
  width:36px;height:36px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);box-shadow:var(--shadow);flex:0 0 auto;font-weight:900;
}

/* ---------- passage call-to-action (📖 지문 보기) ---------- */
.pbtn{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  background:var(--lav);border:2px solid var(--purple);color:var(--purple-dark);
  font-weight:900;font-size:13px;letter-spacing:-.3px;line-height:1;
  padding:9px 13px;border-radius:12px;box-shadow:0 4px 12px rgba(110,91,154,.22);
  transition:background .15s, color .15s, transform .12s;
}
.pbtn:hover{background:#E3DBF5}
.pbtn:active{transform:scale(.96)}
.pbtn .pb-ic{font-size:15px;line-height:1}
.pbtn .pb-badge,.pcta .pb-badge{
  background:var(--purple);color:#fff;font-size:10px;font-weight:900;
  border-radius:999px;padding:2px 7px;letter-spacing:0;line-height:1.5;white-space:nowrap;
}
.pbtn.on{background:var(--purple);color:#fff;border-color:var(--purple-dark)}
.pbtn.on .pb-badge,.pcta.on .pb-badge{background:#fff;color:var(--purple)}
.pcta{
  display:none;width:100%;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#F4EFFD,#EAE3F8);
  border:2px solid var(--purple);color:var(--purple-dark);
  font-weight:900;font-size:14.5px;letter-spacing:-.3px;line-height:1;
  padding:13px 14px;border-radius:14px;margin:2px 0 13px;
  box-shadow:0 6px 16px rgba(110,91,154,.16);transition:background .15s;
  position:relative;
}
.pcta.on{background:var(--purple);color:#fff;border-color:var(--purple-dark)}
.pcta:active{transform:scale(.99)}
@media(max-width:920px){ .pcta{display:flex} }
@media(max-width:400px){
  .pbtn{font-size:12px;padding:8px 10px;gap:5px}
  .pbtn .pb-badge{display:none}
}
.progress{flex:1;height:9px;border-radius:99px;background:#E7E1F3;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#A18FC9,var(--purple));border-radius:99px;transition:width .3s}
.qcount{font-size:12.5px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.qcount b{color:var(--purple)}

.stage{display:grid;grid-template-columns:392px 1fr;gap:14px;align-items:start}
@media(max-width:920px){.stage{grid-template-columns:1fr}}

.passage{
  background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 17px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:80px;
}
@keyframes passGlow{
  0%{box-shadow:0 0 0 0 rgba(110,91,154,.55)}
  100%{box-shadow:0 0 0 14px rgba(110,91,154,0)}
}
.passage.flash{animation:passGlow .9s ease-out 2;border-color:var(--purple)}
.pclose{
  display:inline-flex;align-items:center;gap:5px;background:var(--lav);border:1.5px solid var(--purple);
  color:var(--purple-dark);font-weight:900;font-size:12px;border-radius:999px;padding:6px 12px;line-height:1;
}
.passage h3{margin:0 0 4px;font-size:13px;color:var(--purple);font-weight:900;letter-spacing:-.2px}
.tabs{display:flex;gap:6px;margin:2px 0 10px}
.tab{font-size:12px;font-weight:900;color:var(--ink-3);background:var(--lav-2);border:1px solid var(--lav-3);border-radius:99px;padding:3px 11px}
.tab.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.deskhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.deskhead span{font-size:11.5px;font-weight:900;color:var(--purple);background:var(--lav);border-radius:99px;padding:2px 9px}
@media(max-width:920px){.deskhead{display:none}}
.passage .instr{font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:10px}
.passage p{margin:0 0 9px;font-size:13.6px;line-height:1.8;color:#3A3348;letter-spacing:-.2px}
.passage p:last-child{margin-bottom:0}
.passage .ph{display:inline-block;background:var(--lav);color:var(--purple);font-weight:900;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:6px}
@media(max-width:920px){
  .passage{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;max-height:78vh;border-radius:22px 22px 0 0;
    transform:translateY(102%);transition:transform .28s ease;padding:18px 18px 26px;box-shadow:0 -12px 40px rgba(43,36,56,.22);
  }
  .passage.open{transform:translateY(0)}
  .passage .phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .passage .grab{width:44px;height:5px;border-radius:99px;background:var(--lav-3);margin:0 auto 10px}
}
/* 순서 섞기: 지문을 문제 위에 펼친 상태로 기본 노출 */
@media(max-width:920px){
  .stage.auto .passage{
    position:static;left:auto;right:auto;top:auto;bottom:auto;z-index:auto;transform:none;
    max-height:56vh;border-radius:var(--radius);padding:15px 16px 16px;
    box-shadow:var(--shadow);margin:0 0 12px;overflow:auto;
  }
  .stage.auto .passage .grab{display:none}
  .stage.auto .passage .phead{
    border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px;
  }
  .stage.auto .passage.collapsed{display:none}
  .stage.auto .passage p{font-size:13.4px}
  .autoflag{
    display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--purple);
    background:var(--lav);border:1px solid var(--lav-3);border-radius:99px;padding:4px 10px;margin:0 2px 10px;width:max-content;
  }
}
@media(min-width:921px){ .passage .phead{display:none} }
.autoflag{display:none}
@media(max-width:920px){ .autoflag.on{display:flex} }

.qcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.qnum{
  background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:14px;
  padding:2px 10px;border-radius:7px;letter-spacing:.2px;
}
.school{background:var(--lav);color:var(--purple);font-weight:900;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--lav-3)}
.typepill{margin-left:auto;background:var(--lav-2);color:var(--purple);border:1px solid var(--lav-3);font-weight:900;font-size:11.5px;padding:3px 10px;border-radius:999px}
.qinstr{font-size:12.5px;color:var(--ink-3);font-weight:700;margin:0 0 8px;padding-left:2px}
.stem{font-size:16px;font-weight:800;line-height:1.6;letter-spacing:-.3px;margin:2px 0 12px;white-space:pre-wrap}
.stem .q-id{font-weight:900;color:var(--purple)}

.box{border-radius:12px;padding:13px 15px;margin:0 0 12px;font-size:14px;line-height:1.8;letter-spacing:-.2px}
.box.lav{background:#FBFAFE;border:1.5px solid #D9D0EC}
.box.navy{background:#fff;border:1.5px solid #2E2748;box-shadow:2px 2px 0 rgba(46,39,72,.12)}
.box .lab{display:inline-block;font-weight:900;font-size:12px;color:var(--purple);background:var(--lav);border-radius:6px;padding:1px 8px;margin-bottom:7px}
.box p{margin:0 0 6px}
.box p:last-child{margin-bottom:0}
.box .u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.box .mark{font-weight:900;color:var(--purple)}

.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{
  display:flex;gap:10px;align-items:flex-start;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;
  font-size:14.5px;line-height:1.6;letter-spacing:-.2px;transition:.12s;color:#37313F;
}
.choice:hover{border-color:var(--lav-3);background:#FCFBFF}
.choice .no{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--lav-2);color:var(--purple);
  display:grid;place-items:center;font-size:12.5px;font-weight:900;border:1px solid var(--lav-3);margin-top:1px;
}
.choice .tx{flex:1;white-space:pre-wrap}
.choice.sel{border-color:var(--purple);background:var(--lav-2)}
.choice.sel .no{background:var(--purple);color:#fff;border-color:var(--purple)}
.choice.ok{border-color:var(--green);background:var(--green-bg)}
.choice.ok .no{background:var(--green);color:#fff;border-color:var(--green)}
.choice.ng{border-color:var(--red);background:var(--red-bg)}
.choice.ng .no{background:var(--red);color:#fff;border-color:var(--red)}
.choice:disabled{cursor:default}
.gridhead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--ink-3);margin:2px 0 2px;padding-left:32px}
.gridrow{display:flex;gap:6px}
.gridrow .cell{flex:1;background:var(--lav-2);border-radius:7px;padding:2px 6px;font-size:12.5px;text-align:center;font-weight:700;color:#4A4159}

.fb{margin-top:14px;border-radius:13px;padding:13px 15px;font-size:13.8px;line-height:1.75;letter-spacing:-.2px}
.fb.ok{background:var(--green-bg);border:1.5px solid #BFE5D2}
.fb.ng{background:var(--red-bg);border:1.5px solid #F0C9C9}
.fb .res{font-weight:900;font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.fb.ok .res{color:#1F7A50}
.fb.ng .res{color:#B33A3A}
.fb .ansline{font-weight:800;color:#3A3348;margin-bottom:5px}
.fb .expl{color:#4A4356}
.qnav{display:flex;gap:9px;margin-top:16px;align-items:center}
.btn{
  border-radius:12px;padding:11px 18px;font-weight:900;font-size:14px;letter-spacing:-.2px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-2);transition:.14s;
}
.btn:hover{border-color:var(--lav-3)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 6px 16px rgba(110,91,154,.28)}
.btn.primary:hover{background:var(--purple-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.grow{flex:1;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.modechip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--ink-3)}
.modechip.on{color:var(--purple)}
.switch{width:42px;height:24px;border-radius:99px;background:#DED6EF;position:relative;transition:.2s;flex:0 0 auto}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.switch.on{background:var(--purple)}
.switch.on i{left:20px}

/* short answer */
.shortwrap{margin-top:8px}
.shortwrap textarea{
  width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
  font-family:inherit;font-size:14px;line-height:1.7;color:#37313F;resize:vertical;background:#FBFAFE;
}
.shortwrap textarea:focus{outline:none;border-color:var(--purple-soft);background:#fff}
.exam-note{background:var(--lav-2);border:1.5px dashed var(--lav-3);color:var(--purple);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:800;margin-top:12px}

/* ---------- result ---------- */
.result{background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 26px 22px;text-align:center;margin-top:6px}
.result .lab{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.4px}
.score{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1.1;margin:6px 0 2px;color:var(--purple-dark)}
.score span{font-size:20px;color:var(--ink-3);font-weight:800;letter-spacing:0}
.scorem{font-size:13.5px;color:var(--ink-2);font-weight:700}
.tstats{margin:22px 0 4px;text-align:left;display:flex;flex-direction:column;gap:10px}
.tstat{display:grid;grid-template-columns:130px 1fr 74px;gap:10px;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink-2)}
@media(max-width:520px){.tstat{grid-template-columns:96px 1fr 64px;font-size:11.5px}}
.tstat .bar{height:8px}
.tstat .val{text-align:right;color:var(--purple);font-weight:900}
.wrongs{margin-top:18px;text-align:left}
.wrongs h3{font-size:13px;margin:0 0 8px;color:var(--ink-2)}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--red-bg);color:#B33A3A;border:1px solid #F0C9C9;border-radius:8px;font-size:12px;font-weight:900;padding:3px 9px}
.ractions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.ractions .btn{flex:1;min-width:140px}

/* ---------- reader ---------- */
.reader{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;max-width:880px;margin:0 auto}
.reader h2{margin:0 0 2px;font-size:20px;letter-spacing:-.5px}
.reader .meta{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-bottom:16px}
.reader p{font-size:15px;line-height:1.95;letter-spacing:-.2px;margin:0 0 14px;color:#332D40}
.reader p.dlg{color:#241F33}

.foot{margin:26px 2px 6px;text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:-.1px;line-height:1.9;word-break:keep-all;padding:0 6px}
.foot b{color:var(--purple)}
.foot .fl{display:inline}
.foot .fs{display:inline}
.foot .foot-t{white-space:nowrap}
@media(max-width:520px){.foot{font-size:11px}}
@media(max-width:600px){
  .foot{line-height:2.05}
  .foot .fl{display:block}
  .foot .fs{display:none}
}
.sheet-mask{position:fixed;inset:0;background:rgba(36,31,51,.35);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#241F33;color:#fff;font-size:13px;font-weight:800;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<style>
/* ================= 돋움 자료 보호 레이어 (자동 삽입) ================= */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,option,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}

function b64bytes(s){
  var bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesB64(u){
  var s = "", c = 0x8000;
  for(var i=0;i<u.length;i+=c) s += String.fromCharCode.apply(null, u.subarray(i, i + c));
  return btoa(s);
}

/* --- Web Crypto 경로 --- */
function deriveAes(pw){
  var data = new TextEncoder().encode(pw);
  return subtle.importKey("raw", data, "PBKDF2", false, ["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2", salt:b64bytes(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function aesOpen(key){
  return subtle.decrypt({name:"AES-GCM", iv:b64bytes(ENC.iv)}, key, b64bytes(ENC.ct)).then(function(buf){
    return new TextDecoder("utf-8").decode(new Uint8Array(buf));
  });
}
function aesImport(rawB64){ return subtle.importKey("raw", b64bytes(rawB64), {name:"AES-GCM"}, false, ["decrypt"]); }

/* --- 폴백 키스트림 경로 (Web Crypto 미지원 환경) --- */
function fnv1a(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h = (h ^ s.charCodeAt(i)) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xs(s){
  var x = s[0], y = s[1], z = s[2], w = s[3];
  var t = (x ^ ((x << 11) >>> 0)) >>> 0;
  var n = (w ^ (w >>> 19) ^ t ^ (t >>> 8)) >>> 0;
  return [y, z, w, n];
}
function fbSeed(pw, saltHex){
  var base = pw + "\u0000" + saltHex, cur = base, w = [];
  for(var i=0;i<4;i++){ var h = fnv1a(cur); w.push(h); cur = base + "#" + h; }
  for(var j=0;j<1024;j++) w = xs(w);
  return w;
}
function ksBytes(seed, n){
  var s = seed.slice(0), out = new Uint8Array(n), k = 0;
  while(k < n){
    s = xs(s);
    var v = s[3];
    if(k < n) out[k++] = (v >>> 24) & 255;
    if(k < n) out[k++] = (v >>> 16) & 255;
    if(k < n) out[k++] = (v >>> 8) & 255;
    if(k < n) out[k++] = v & 255;
  }
  return out;
}
function fbOpen(seed, b64){
  var ct = b64bytes(b64), k = ksBytes(seed, ct.length), out = new Uint8Array(ct.length);
  for(var i=0;i<ct.length;i++) out[i] = ct[i] ^ k[i];
  return new TextDecoder("utf-8").decode(out);
}
function fbSeedFromCsv(csv){ return csv.split(",").map(function(x){ return Number(x) >>> 0; }); }

function remember(mode, val){
  try{ sessionStorage.setItem(STORE, JSON.stringify({m:mode, k:val, t:Date.now()})); }catch(e){}
}
function forget(){ try{ sessionStorage.removeItem(STORE); }catch(e){} }

function openWith(value){
  var plain = (value && value.indexOf("DM1|") === 0) ? value.slice(4) : null;
  return plain;
}

function attempt(pw){
  var chain = Promise.resolve(null);
  if(subtle){
    chain = deriveAes(pw).then(function(key){
      return aesOpen(key).then(function(text){
        var plain = openWith(text);
        if(!plain) throw new Error("bad magic");
        return subtle.exportKey("raw", key).then(function(raw){
          remember("aes", bytesB64(new Uint8Array(raw)));
          return plain;
        });
      });
    }).catch(function(){ return null; });
  }
  return chain.then(function(ok){
    if(ok) return ok;
    try{
      var seed = fbSeed(pw, ENC.saltHex);
      var plain = openWith(fbOpen(seed, ENC.fb.ct));
      if(plain){ remember("fb", seed.join(",")); return plain; }
    }catch(e){}
    return null;
  });
}

function restore(){
  var raw = null;
  try{ raw = sessionStorage.getItem(STORE); }catch(e){ return Promise.resolve(null); }
  if(!raw) return Promise.resolve(null);
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ forget(); return Promise.resolve(null); }
  if(o && o.m === "aes" && subtle){
    return aesImport(o.k).then(aesOpen).then(function(text){
      var plain = openWith(text);
      if(!plain) throw new Error("bad");
      return plain;
    }).catch(function(){ forget(); return null; });
  }
  if(o && o.m === "fb"){
    try{
      var plain = openWith(fbOpen(fbSeedFromCsv(o.k), ENC.fb.ct));
      if(plain) return Promise.resolve(plain);
    }catch(e){}
  }
  forget();
  return Promise.resolve(null);
}

/* ---------------- quiz ---------------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(ids, title){
  sess = { ids, i:0, title, mode:state.mode, picks:{}, revealed:{}, shortText:{}, done:{}, inlineCollapsed:false };
  renderQuiz();
}

function curItem(){ return BYNUM[sess.ids[sess.i]]; }

function startQuizByIds(ids, title){ startQuiz(ids, title); }

function renderQuiz(){
  window.scrollTo(0,0);
  const it = curItem();
  const n = sess.ids.length;
  const pct = Math.round((sess.i)/n*100);
  const answered = sess.revealed[it.n];
  const picked = sess.picks[it.n];
  const isShort = !!it.short;

  let blocks = (it.blocks||[]).map(b=>{
    const lab = b.label ? `<div class="lab">${esc(b.label)}</div>` : '';
    return `<div class="box ${b.k}">${lab}${paras(b.text).map(p=>`<p>${rich(p)}</p>`).join('')}</div>`;
  }).join('');

  let choices = '';
  if(isShort){
    choices = `<div class="shortwrap"><textarea id="shortIn" placeholder="답을 한 문장으로 써 보세요." ${answered?'disabled':''}>${esc(sess.shortText[it.n]||'')}</textarea></div>`;
  } else if(it.grid){
    const head = `<div class="gridhead">${it.grid.map(g=>`<span style="flex:1;text-align:center">${esc(g)}</span>`).join('')}</div>`;
    choices = head + it.choices.map((c,idx)=>{
      const no = idx+1, vals = c.includes('||') ? c.split('||') : c.split(/\s+/);
      const cls = ['choice']; let mark='';
      if(sess.mode==='practice' && answered){ if(no===it.ans) cls.push('ok'); else if(no===picked) cls.push('ng'); }
      else if(picked===no) cls.push('sel');
      if(sess.mode==='practice' && sess.done[it.n] && no===it.ans) cls.push('ok');
      return `<button class="${cls.join(' ')}" data-pick="${no}" ${(sess.mode==='practice'&&(answered||sess.done[it.n]))?'disabled':''}>
        <span class="no">${no}</span>
        <span class="tx"><span class="gridrow">${vals.map(v=>`<span class="cell">${esc(v)}</span>`).join('')}</span></span>
      </button>`;
    }).join('');
  } else {
    choices = it.choices.map((c,idx)=>{
      const no = idx+1;
      const cls = ['choice']; 
      if(sess.mode==='practice' && answered){ if(no===it.ans) cls.push('ok'); else if(no===picked) cls.push('ng'); }
      else if(picked===no) cls.push('sel');
      if(sess.mode==='practice' && sess.done[it.n] && no===it.ans) cls.push('ok');
      return `<button class="${cls.join(' ')}" data-pick="${no}" ${(sess.mode==='practice'&&(answered||sess.done[it.n]))?'disabled':''}>
        <span class="no">${no}</span><span class="tx">${rich(c)}</span>
      </button>`;
    }).join('');
  }

  let fb = '';
  if(sess.mode==='practice' && answered){
    const ok = !isShort && picked===it.ans;
    fb = `<div class="fb ${ok?'ok':'ng'}">
      <div class="res">${ok?'✅ 정답입니다':'❌ 아쉬워요'}</div>
      <div class="ansline">정답 ${it.ans?CIRC[it.ans-1]+' '+esc(it.choices[it.ans-1]):''}</div>
      <div class="expl">${rich(it.expl)}</div>
      ${isShort?'':''}
    </div>`;
    if(isShort){
      fb = `<div class="fb ok"><div class="res">📝 예시 답안</div><div class="expl">${rich(it.expl)}</div></div>`;
    }
  } else if(sess.mode==='practice' && sess.done[it.n] && isShort){
    fb = `<div class="fb ok"><div class="res">📝 예시 답안</div><div class="expl">${rich(it.expl)}</div></div>`;
  }

  const isLast = sess.i === n-1;
  const showNext = sess.mode==='practice' ? (answered || sess.done[it.n]) : false;

  const autoType = AUTO_PASSAGE.indexOf(it.tno) >= 0;
  const collapsed = autoType && !!sess.inlineCollapsed;

  const ownBadge = it.passage ? `<span class="pb-badge">전용 지문</span>` : '';
  const passageBtn = `<button class="pbtn" id="openPassage" aria-expanded="false" title="지문 보기">
      <span class="pb-ic">📖</span><span class="pb-tx">지문 보기</span>${ownBadge}
    </button>`;
  const passageCta = `<button class="pcta" id="openPassage2" aria-expanded="false">
      <span class="pb-ic">📖</span><span class="pb-tx">지문 보기</span>${ownBadge}
    </button>`;
  const passageHtml = passagePanel(it);

  SCR.innerHTML = `
    <div class="qtop">
      <button class="iconbtn" id="backBtn">←</button>
      ${passageBtn}
      <div class="progress"><i style="width:${pct}%"></i></div>
      <span class="qcount"><b>${sess.i+1}</b> / ${n}</span>
    </div>
    <div class="stage ${autoType?'auto':''}">
      <aside class="passage ${collapsed?'collapsed':''}" id="passage">${passageHtml}</aside>
      <section class="qcard">
        <div class="qhead">
          <span class="qnum">${it.n}</span>
          ${it.badge?`<span class="school">${esc(it.badge)}</span>`:''}
          <span class="typepill">유형 ${String(it.tno).padStart(2,'0')}</span>
        </div>
        ${passageCta}
        ${autoType && !collapsed?`<div class="autoflag on">📖 지문을 문제와 함께 펼쳐 두었습니다</div>`:''}
        ${it.instr?`<div class="qinstr">${esc(it.instr)}</div>`:''}
        <div class="stem">${rich(it.stem)}</div>
        ${blocks}
        <div class="choices">${choices}</div>
        ${fb}
        <div class="qnav">
          <button class="btn" id="prevBtn" ${sess.i===0?'disabled':''}>이전</button>
          <div class="spacer"></div>
          ${sess.mode==='practice'
            ? (showNext? `<button class="btn primary" id="nextBtn">${isLast?'결과 보기':'다음 문제 →'}</button>` : '')
            : `<button class="btn primary" id="nextBtn">${isLast?'채점하기':'다음 문제 →'}</button>`}
        </div>
      </section>
    </div>`;
  bindQuiz(it, isShort, isLast);
}

function passagePanel(it){
  const baseBody = paras(DATA.basePassage).map(p=>`<p>${rich(p)}</p>`).join('');
  const auto = AUTO_PASSAGE.indexOf(it.tno) >= 0;
  const ownTag = it.passage ? `<span class="pb-badge" style="background:var(--purple);color:#fff;margin-left:6px">전용 지문</span>` : '';
  const head = `<div class="grab"></div><div class="phead"><h3 style="margin:0;font-size:13px;color:var(--purple);display:flex;align-items:center">📖 지문${ownTag}</h3><button class="pclose" id="closePassage">✕ ${auto?'지문 접기':'지문 닫기'}</button></div>`;
  if (!it.passage){
    return head + `<div class="deskhead"><span>📖 기본 지문</span><span style="background:none;color:var(--ink-3)">김유정 「동백꽃」 전문</span></div>` + baseBody;
  }
  const own = `<p class="instr" style="margin-top:2px">${esc(it.instr||'')}</p>` + paras(it.passage).map(p=>`<p>${rich(p)}</p>`).join('');
  return head + `
    <div class="tabs"><button class="tab on" data-tab="own">문항 지문</button><button class="tab" data-tab="base">기본 지문</button></div>
    <div class="tabpane" data-pane="own">${own}</div>
    <div class="tabpane" data-pane="base" style="display:none">${baseBody}</div>`;
}

function bindQuiz(it, isShort, isLast){
  const mask = document.getElementById('mask');
  const passage = document.getElementById('passage');
  const isMobile = ()=> window.innerWidth <= 920;
  const syncLabels = (open)=>{
    document.querySelectorAll('.pbtn, .pcta').forEach(b=>{
      b.classList.toggle('on', open);
      const tx = b.querySelector('.pb-tx'); if(tx) tx.textContent = open ? '지문 닫기' : '지문 보기';
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  };
  const openDrawer = ()=>{ passage.classList.add('open'); mask.classList.add('on'); syncLabels(true); };
  const closeDrawer = ()=>{ passage.classList.remove('open'); mask.classList.remove('on'); syncLabels(false); };
  const toggleDrawer = ()=> passage.classList.contains('open') ? closeDrawer() : openDrawer();
  /* 순서 섞기: 문제 위에 펼친 지문을 접고 편다 */
  const inlineShown = ()=> !passage.classList.contains('collapsed');
  const setInline = (show)=>{
    passage.classList.toggle('collapsed', !show);
    sess.inlineCollapsed = !show;
    const flag = document.querySelector('.autoflag');
    if(flag) flag.style.display = show ? 'flex' : 'none';
    syncLabels(show);
  };
  document.getElementById('backBtn').onclick = ()=>{ if(confirm('홈으로 나갈까요? 풀이 기록은 저장됩니다.')) renderHome(); };
  document.querySelectorAll('#openPassage, #openPassage2').forEach(b=>{
    b.onclick = ()=>{
      if(isMobile()){
        if(autoType){ setInline(!inlineShown()); return; }
        toggleDrawer(); return;
      }
      passage.classList.remove('flash'); void passage.offsetWidth;
      passage.classList.add('flash');
      passage.scrollTop = 0;
      passage.scrollIntoView({block:'nearest', behavior:'smooth'});
    };
  });
  const autoType = AUTO_PASSAGE.indexOf(it.tno) >= 0;
  syncLabels(isMobile() && autoType ? inlineShown() : passage.classList.contains('open'));
  const cp = document.getElementById('closePassage');
  if(cp) cp.onclick = ()=>{ if(autoType && isMobile()) setInline(false); else closeDrawer(); };
  document.querySelectorAll('.tabs .tab').forEach(tb=>{
    tb.onclick = ()=>{
      document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.toggle('on', x===tb));
      document.querySelectorAll('.tabpane').forEach(p=>{ p.style.display = (p.dataset.pane===tb.dataset.tab)?'block':'none'; });
      passage.scrollTop = 0;
    };
  });
  mask.onclick = closeDrawer;
  document.getElementById('prevBtn').onclick = ()=>{ if(sess.i>0){ sess.i--; renderQuiz(); window.scrollTo({top:0,behavior:'smooth'}); } };
  const nb = document.getElementById('nextBtn');
  if(nb) nb.onclick = ()=>{
    if(sess.mode==='practice' && !(sess.revealed[it.n]||sess.done[it.n])){ return; }
    if(isLast){ renderResult(); return; }
    sess.i++; renderQuiz(); window.scrollTo({top:0,behavior:'smooth'});
  };
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = ()=>{
      const no = +el.dataset.pick;
      if(sess.mode==='practice'){
        sess.picks[it.n] = no; sess.revealed[it.n] = true;
        state.progress[it.n] = (no===it.ans)?2:1; save();
        renderQuiz();
        const fbEl = document.querySelector('.fb');
        if (fbEl) setTimeout(()=>fbEl.scrollIntoView({block: window.innerWidth<=920?'center':'nearest', behavior:'smooth'}), 60);
      } else {
        sess.picks[it.n] = no; sess.done[it.n] = true; renderQuiz();
      }
    };
  });
  const si = document.getElementById('shortIn');
  if(si){
    si.oninput = ()=>{ sess.shortText[it.n] = si.value; };
    si.onblur = ()=>{ sess.shortText[it.n] = si.value; };
  }
  if(isShort && !sess.done[it.n]){
    const nav = document.querySelector('.qnav');
    const revealBtn = document.createElement('button');
    revealBtn.className = 'btn primary';
    revealBtn.textContent = '예시 답안 보기';
    revealBtn.onclick = ()=>{ sess.done[it.n]=true; if(!state.progress[it.n]) state.progress[it.n]=1; save(); renderQuiz(); };
    nav.insertBefore(revealBtn, nav.lastElementChild);
  }
}

/* ---------------- result ---------------- */
function renderResult(){
  window.scrollTo(0,0);
  const ids = sess.ids;
  let right=0;
  ids.forEach(n=>{ const it=BYNUM[n]; if(it.short) { if(state.progress[n]===2) right++; } else if(sess.picks[n]===it.ans) right++; });
  const total = ids.length;
  const pct = Math.round(right/total*100);
  const byType = {};
  ids.forEach(n=>{
    const it=BYNUM[n]; const t=it.tno;
    byType[t] = byType[t]||{t, total:0, right:0, title:it.tname};
    byType[t].total++;
    if(!it.short && sess.picks[n]===it.ans) byType[t].right++;
  });
  const rows = Object.values(byType).map(r=>{
    const p = Math.round(r.right/r.total*100);
    return `<div class="tstat"><span>유형 ${String(r.t).padStart(2,'0')} ${r.total}문항</span><span class="bar"><i style="width:${p}%;background:linear-gradient(90deg,#A18FC9,var(--purple))"></i></span><span class="val">${r.right}/${r.total}</span></div>`;
  }).join('');
  const wrongIds = ids.filter(n=>{ const it=BYNUM[n]; return !it.short && sess.picks[n]!==it.ans; });
  SCR.innerHTML = `
    <div class="result">
      <div class="lab">${esc(sess.title)}</div>
      <div style="font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:.4px;margin-top:2px">채점 결과</div>
      <div class="score">${right}<span> / ${total}</span></div>
      <div class="scorem">정답률 ${pct}% ${pct===100?'· 완벽해요! 🎉':pct>=80?'· 아주 좋아요 👏':'· 다시 한 번 확인해 봐요'}</div>
      <div class="tstats">${rows}</div>
      ${wrongIds.length?`<div class="wrongs"><h3>틀린 문항</h3><div class="wlist">${wrongIds.map(n=>`<a class="wchip" href="#" data-jump="${n}">${n}번</a>`).join('')}</div></div>`:''}
    </div>
    <div class="ractions">
      <button class="btn primary" id="retryWrong" ${wrongIds.length?'':'disabled'}>틀린 문제 다시 풀기${wrongIds.length?' ('+wrongIds.length+')':''}</button>
      <button class="btn" id="retryAll">처음부터 다시</button>
      <button class="btn" id="goHome">홈으로</button>
    </div>`;
  document.getElementById('goHome').onclick = renderHome;
  document.getElementById('retryAll').onclick = ()=>startQuiz(sess.ids.slice(), sess.title);
  const rw = document.getElementById('retryWrong');
  if(rw && wrongIds.length) rw.onclick = ()=>startQuiz(wrongIds, '틀린 문제 다시 풀기');
  document.querySelectorAll('[data-jump]').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); const n=+a.dataset.jump; const idx=sess.ids.indexOf(n); if(idx>=0){ sess.i=idx; renderQuiz(); window.scrollTo({top:0,behavior:'smooth'}); } };
  });
}

/* --- 시작 --- */
(function start(){
  if(AUTO && AUTO.length === 4){
    try{
      var autoPlain = openWith(fbOpen(AUTO, ENC.fb.ct));
      if(autoPlain){ boot(autoPlain); return; }
    }catch(e){}
  }
  Promise.resolve(restore()).then(function(plain){
    if(plain){ boot(plain); } else { showLock(); }
  }).catch(function(){ showLock(); });
})();
})();
</script>
