<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0FA">
<title>비상(박현숙) 추론·형태소 퀴즈 · 돋움국어논술학원</title>
<style>

:root{
  --purple:#6E5B9A; --purple-dark:#56457F; --purple-soft:#8A78B4;
  --lav:#ECE8F6; --lav-2:#F7F5FC; --lav-3:#DCD4EE;
  --ink:#2B2438; --ink-2:#5B5468; --ink-3:#8C859B;
  --mint:#7ED9C3; --mint-ink:#1F5F4E;
  --gold:#FFD97A; --gold-ink:#7A5B00;
  --green:#2E9E6B; --green-bg:#E7F6EE;
  --red:#D24B4B; --red-bg:#FBEAEA;
  --paper:#FFFFFF; --bg:#F3F0FA;
  --line:#E4DEF0;
  --shadow:0 8px 24px rgba(76,60,120,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:34px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:14px 16px 0}
.topbar{position:sticky;top:0;z-index:40;padding:10px 0 8px;background:linear-gradient(180deg,var(--bg) 78%,rgba(243,240,250,0))}
.player{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #1c1a22;border-radius:999px;
  padding:7px 8px 7px 7px;box-shadow:var(--shadow)}
.play{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;
  display:grid;place-items:center;box-shadow:0 3px 8px rgba(110,91,154,.35)}
.play:active{transform:scale(.94)}
.track{flex:1;min-width:0;font-weight:800;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .np{font-size:10.5px;letter-spacing:.4px;color:var(--ink-3);font-weight:800;margin-right:4px}
.ctrl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#222;font-weight:700;flex:0 0 auto}
.ctrl .heart{color:var(--red)}
.pill-mint{flex:0 0 auto;background:var(--mint);color:var(--mint-ink);font-weight:900;font-size:12px;
  padding:4px 12px;border-radius:999px;border:1.5px solid #1c1a22}
@media(max-width:520px){.ctrl{display:none}.track{font-size:13px}}
.unitbar{display:flex;gap:7px;margin:9px 0 0;overflow:auto;padding-bottom:2px}
.ubtn{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;background:#fff;border:1.5px solid var(--line);
  border-radius:13px;padding:9px 10px;font-weight:900;font-size:13px;letter-spacing:-.2px;color:var(--ink-2);
  box-shadow:0 4px 12px rgba(76,60,120,.05);white-space:nowrap;transition:.15s}
.ubtn .un{font-size:10.5px;font-weight:900;background:var(--lav);color:var(--purple);border-radius:999px;padding:2px 7px}
.ubtn.on{background:var(--purple);color:#fff;border-color:var(--purple-dark)}
.ubtn.on .un{background:rgba(255,255,255,.22);color:#fff}
@media(max-width:400px){.ubtn{font-size:12px;padding:8px 6px}.ubtn .un{display:none}}

.hero{padding:16px 4px 4px}
.brand{font-size:12.5px;font-weight:800;letter-spacing:.2px;color:var(--purple);display:flex;flex-wrap:wrap;align-items:baseline;gap:5px}
.brand .brand-t{font-weight:800;color:var(--ink-3);white-space:nowrap}
.hero h1{margin:4px 0 0;font-size:29px;font-weight:900;letter-spacing:-1px;line-height:1.22}
.hero .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge-dark{background:#241F33;color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:8px;letter-spacing:.3px}
.hero .sub{color:var(--ink-2);font-size:13.5px;margin-top:9px}
.hero .sub b{color:var(--purple)}
.statrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 13px;box-shadow:var(--shadow);min-width:104px}
.stat .k{font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.2px}
.stat .v{font-size:17px;font-weight:900;letter-spacing:-.5px;color:var(--purple)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0 4px}
.qbtn{display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);transition:.15s;text-align:left}
.qbtn:hover{border-color:var(--lav-3);transform:translateY(-1px)}
.qbtn .ic{font-size:16px}
.qbtn .t{font-weight:900;font-size:14.5px;letter-spacing:-.3px}
.qbtn .d{font-size:11.5px;color:var(--ink-3);font-weight:600}
.qbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.qbtn.primary .d{color:#DCD4EE}
@media(max-width:640px){.quick{grid-template-columns:1fr 1fr}.qbtn.primary{grid-column:1/-1}.qbtn{padding:11px 12px}.qbtn .t{font-size:13.5px}.qbtn .d{font-size:11px}}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:16px;margin:0;font-weight:900;letter-spacing:-.3px}
.sec-title .hint{font-size:12px;color:var(--ink-3);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.modes{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.modes{grid-template-columns:1fr}}
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 15px 13px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.16s;text-align:left;position:relative}
.mcard:hover{transform:translateY(-2px);border-color:var(--lav-3);box-shadow:0 12px 28px rgba(76,60,120,.12)}
.mcard .tag{display:flex;align-items:center;gap:7px}
.mcard .mic{font-size:16px;line-height:1}
.mcard .cnt{font-size:11.5px;color:var(--ink-3);font-weight:800;margin-left:auto}
.mcard .tt{font-size:15px;font-weight:900;letter-spacing:-.4px;line-height:1.3}
.mcard .dd{font-size:11.5px;color:var(--ink-3);font-weight:700;line-height:1.45;word-break:keep-all}
.bar{height:7px;border-radius:99px;background:var(--lav);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple-soft),var(--purple));border-radius:99px;transition:width .4s}
.mcard .meta{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.mcard .meta b{color:var(--purple)}
.mcard.done .mic{filter:none}
.mcard.done .cnt{color:var(--green)}

.qtop{display:flex;align-items:center;gap:10px;margin:8px 2px 12px}
.iconbtn{width:36px;height:36px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);box-shadow:var(--shadow);flex:0 0 auto;font-weight:900}
.pbtn{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;background:var(--lav);border:2px solid var(--purple);
  color:var(--purple-dark);font-weight:900;font-size:12.5px;letter-spacing:-.3px;line-height:1;padding:9px 12px;border-radius:12px;
  box-shadow:0 4px 12px rgba(110,91,154,.22)}
.pbtn:active{transform:scale(.96)}
.progress{flex:1;height:9px;border-radius:99px;background:#E7E1F3;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#A18FC9,var(--purple));border-radius:99px;transition:width .3s}
.qcount{font-size:12.5px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.qcount b{color:var(--purple)}

.qcard{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qnum{background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:14px;padding:2px 10px;border-radius:7px;letter-spacing:.2px}
.school{background:var(--lav);color:var(--purple);font-weight:900;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--lav-3)}
.school.hot{background:#FFF0DC;color:#8A5300;border-color:#F5D8AE}
.school.trap{background:#FBEAEA;color:#B33A3A;border-color:#F0C9C9}
.typepill{margin-left:auto;background:var(--lav-2);color:var(--purple);border:1px solid var(--lav-3);font-weight:900;font-size:11.5px;padding:3px 10px;border-radius:999px}
.stem{font-size:16px;font-weight:800;line-height:1.6;letter-spacing:-.3px;margin:2px 0 12px;white-space:pre-wrap;word-break:keep-all}
.box{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:13.6px;line-height:1.75;letter-spacing:-.2px;
  background:#FBFAFE;border:1.5px solid #D9D0EC;white-space:pre-wrap;word-break:keep-all}
.box .lab{display:inline-block;font-weight:900;font-size:12px;color:var(--purple);background:var(--lav);border-radius:6px;padding:1px 8px;margin-bottom:6px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:13px;padding:11px 13px;font-size:14.5px;line-height:1.6;letter-spacing:-.2px;transition:.12s;color:#37313F}
.choice:hover{border-color:var(--lav-3);background:#FCFBFF}
.choice .no{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--lav-2);color:var(--purple);
  display:grid;place-items:center;font-size:12.5px;font-weight:900;border:1px solid var(--lav-3);margin-top:1px}
.choice .tx{flex:1;white-space:pre-wrap}
.choice.sel{border-color:var(--purple);background:var(--lav-2)}
.choice.sel .no{background:var(--purple);color:#fff;border-color:var(--purple)}
.choice.ok{border-color:var(--green);background:var(--green-bg)}
.choice.ok .no{background:var(--green);color:#fff;border-color:var(--green)}
.choice.ng{border-color:var(--red);background:var(--red-bg)}
.choice.ng .no{background:var(--red);color:#fff;border-color:var(--red)}
.choice.miss{border-color:#D9A24B;background:#FFF7E8}
.choice.miss .no{background:#D9A24B;color:#fff;border-color:#D9A24B}
.choice:disabled{cursor:default}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.oxbtn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 10px;font-weight:900;font-size:20px;
  letter-spacing:.5px;box-shadow:var(--shadow);transition:.14s}
.oxbtn small{display:block;font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:0;margin-top:2px}
.oxbtn.sel{border-color:var(--purple);background:var(--lav-2)}
.oxbtn.ok{border-color:var(--green);background:var(--green-bg)}
.oxbtn.ng{border-color:var(--red);background:var(--red-bg)}
.fb{margin-top:14px;border-radius:13px;padding:13px 15px;font-size:13.8px;line-height:1.75;letter-spacing:-.2px}
.fb.ok{background:var(--green-bg);border:1.5px solid #BFE5D2}
.fb.ng{background:var(--red-bg);border:1.5px solid #F0C9C9}
.fb .res{font-weight:900;font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.fb.ok .res{color:#1F7A50}
.fb.ng .res{color:#B33A3A}
.fb .ansline{font-weight:800;color:#3A3348;margin-bottom:5px;white-space:pre-wrap}
.fb .expl{color:#4A4356;white-space:pre-wrap}
.qnav{display:flex;gap:9px;margin-top:16px;align-items:center}
.btn{border-radius:12px;padding:11px 18px;font-weight:900;font-size:14px;letter-spacing:-.2px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-2);transition:.14s}
.btn:hover{border-color:var(--lav-3)}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 6px 16px rgba(110,91,154,.28)}
.btn.primary:hover{background:var(--purple-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.grow{flex:1;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.modechip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--ink-3)}
.modechip.on{color:var(--purple)}
.switch{width:42px;height:24px;border-radius:99px;background:#DED6EF;position:relative;transition:.2s;flex:0 0 auto}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.switch.on{background:var(--purple)}
.switch.on i{left:20px}
.typing{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
  font-family:inherit;font-size:14.5px;line-height:1.7;color:#37313F;resize:vertical;background:#FBFAFE}
.typing:focus{outline:none;border-color:var(--purple-soft);background:#fff}
.typing.short{min-height:52px}

.result{background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 26px 22px;text-align:center;margin-top:6px}
.result .lab{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.4px}
.score{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1.1;margin:6px 0 2px;color:var(--purple-dark)}
.score span{font-size:20px;color:var(--ink-3);font-weight:800;letter-spacing:0}
.scorem{font-size:13.5px;color:var(--ink-2);font-weight:700}
.tstats{margin:22px 0 4px;text-align:left;display:flex;flex-direction:column;gap:10px}
.tstat{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink-2)}
@media(max-width:520px){.tstat{grid-template-columns:104px 1fr 64px;font-size:11.5px}}
.tstat .bar{height:8px}
.tstat .val{text-align:right;color:var(--purple);font-weight:900}
.wrongs{margin-top:18px;text-align:left}
.wrongs h3{font-size:13px;margin:0 0 8px;color:var(--ink-2)}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--red-bg);color:#B33A3A;border:1px solid #F0C9C9;border-radius:8px;font-size:12px;font-weight:900;padding:3px 9px}
.ractions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.ractions .btn{flex:1;min-width:140px}

/* concept */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:900px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cgrid{grid-template-columns:1fr}}
.ccard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;text-align:left;
  box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;transition:.15s;min-height:66px}
.ccard:hover{transform:translateY(-2px);border-color:var(--lav-3)}
.ccard .ci{font-size:19px}
.ccard .ct{font-weight:900;font-size:14.5px;letter-spacing:-.3px;line-height:1.35}
.ccard .cn{font-size:11px;color:var(--ink-3);font-weight:800;margin-top:2px}
.cview{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.cview h2{margin:0 0 2px;font-size:21px;letter-spacing:-.6px}
.cview .csub{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-bottom:14px}
.csec{border-top:1px dashed var(--lav-3);padding:11px 0 3px}
.csec:first-of-type{border-top:none;padding-top:0}
.csec .ch{font-size:12.5px;font-weight:900;color:var(--purple);margin-bottom:3px}
.csec .cb{font-size:14.3px;line-height:1.8;color:#3A3348;white-space:pre-wrap;letter-spacing:-.2px;word-break:keep-all}

/* reader */
.reader{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px 20px;max-width:880px;margin:0 auto}
.reader h2{margin:0 0 2px;font-size:21px;letter-spacing:-.6px;line-height:1.3}
.reader .meta{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-bottom:14px}
.reader .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.reader .ph .hh{font-size:13px;font-weight:900;color:var(--purple);background:var(--lav);border-radius:8px;padding:3px 10px}
.reader p{margin:0 0 12px;font-size:15px;line-height:1.95;letter-spacing:-.2px;color:#332D40;word-break:keep-all}
.reader .note{background:#FFFBF1;border:1.5px dashed #EBD9AE;border-radius:12px;padding:10px 13px;margin:2px 0 14px;
  font-size:13px;line-height:1.75;color:#6B5320;white-space:pre-wrap}
.reader .note b{color:#8A5300}
.reader .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--lav-2);border:1.5px solid var(--lav-3);color:var(--purple);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:900}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple)}

.foot{margin:26px 2px 6px;text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:-.1px;line-height:1.9;word-break:keep-all;padding:0 6px}
.foot b{color:var(--purple)}
.foot .fl{display:inline}
.foot .fs{display:inline}
.foot .foot-t{white-space:nowrap}
@media(max-width:600px){.foot{line-height:2.05}.foot .fl{display:block}.foot .fs{display:none}}

.sheet-mask{position:fixed;inset:0;background:rgba(36,31,51,.4);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:22px 22px 0 0;
  max-height:82vh;transform:translateY(103%);transition:transform .26s ease;display:flex;flex-direction:column;
  box-shadow:0 -12px 40px rgba(43,36,56,.25)}
.sheet.open{transform:translateY(0)}
@media(min-width:760px){
  .sheet{left:50%;right:auto;width:min(740px,92vw);transform:translate(-50%,103%);border-radius:22px 22px 0 0}
  .sheet.open{transform:translate(-50%,0)}
  .sheet .sbody p{font-size:14.6px}
}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--lav-3);margin:10px auto 4px;flex:0 0 auto}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheet .shead .st{font-size:13.5px;font-weight:900;letter-spacing:-.3px;line-height:1.35}
.sheet .shead .ss{font-size:11px;color:var(--ink-3);font-weight:700}
.sheet .sbody{overflow:auto;padding:14px 18px 30px;-webkit-overflow-scrolling:touch}
.sheet .sbody p{font-size:14.2px;line-height:1.9;margin:0 0 11px;color:#332D40;letter-spacing:-.2px;word-break:keep-all}
.sheet .sbody .hh{font-size:12.5px;font-weight:900;color:var(--purple);margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#241F33;color:#fff;font-size:13px;
  font-weight:800;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

</style>
<style>
/* ================= 돋움 자료 보호 레이어 (자동 삽입) ================= */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,option,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
body.dm-locked{overflow:hidden}

/* --- 워터마크: 화면 전체 고정 오버레이 --- */
.dm-wm{position:fixed;inset:0;z-index:2147482000;pointer-events:none;

/* --- 잠금 화면 --- */
body.dm-locked > .app,body.dm-locked > .footer-fixed,body.dm-locked > .sheet-mask,body.dm-locked > .toast{display:none!important}
.dm-lock{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:22px 18px;
  background:radial-gradient(1100px 620px at 50% -12%,#F8F6FD 0%,#EFEAF9 42%,#DFD7F0 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color:#2B2438;opacity:0;transition:opacity .18s ease;overflow:auto}
.dm-lock.dm-on{opacity:1}
.dm-card{width:100%;max-width:378px;background:#fff;border:1px solid #E4DEF0;border-radius:24px;
  padding:26px 22px 20px;box-shadow:0 20px 60px rgba(76,60,120,.18);text-align:center}
.dm-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;color:#6E5B9A;
  background:#F1ECFA;border-radius:999px;padding:5px 12px}
.dm-logo{margin:15px 0 3px;font-size:23px;font-weight:900;letter-spacing:-.7px;color:#2B2438}
.dm-title{font-size:13.5px;font-weight:800;color:#6E5B9A;letter-spacing:-.1px}
.dm-sub{margin:13px 0 18px;font-size:12.5px;line-height:1.65;color:#5B5468;word-break:keep-all}
.dm-sub b{color:#6E5B9A;font-weight:800}
.dm-input{display:block;width:100%;height:50px;border:1.5px solid #DCD4EE;border-radius:14px;padding:0 15px;
  font-size:16px;font-family:inherit;color:#2B2438;background:#FBFAFE;letter-spacing:.08em}
.dm-input::placeholder{color:#A9A2BA;letter-spacing:0}
.dm-input:focus{outline:none;border-color:#6E5B9A;background:#fff;box-shadow:0 0 0 4px rgba(110,91,154,.13)}
.dm-btn{margin-top:10px;width:100%;height:50px;border:none;border-radius:14px;background:#6E5B9A;color:#fff;
  font-size:15px;font-weight:900;font-family:inherit;letter-spacing:-.2px;box-shadow:0 8px 18px rgba(110,91,154,.28)}
.dm-btn:active{transform:scale(.99)}
.dm-btn:disabled{opacity:.62;box-shadow:none}
.dm-msg{min-height:19px;margin:10px 0 0;font-size:12.5px;font-weight:700;color:#D24B4B;line-height:1.5}
.dm-msg.ok{color:#2E9E6B}
.dm-foot{margin:15px 0 0;font-size:10.5px;line-height:1.75;color:#9A93AA;word-break:keep-all}
.dm-sec{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:12px;font-size:10.5px;color:#B3ADBF}

/* --- 인쇄 차단 --- */
.dm-print{display:none}
@media print{
  html,body{background:#fff!important;height:auto!important}
  body > *:not(.dm-print){display:none!important}
  .dm-print{display:flex!important;align-items:center;justify-content:center;min-height:78vh;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:17px;font-weight:800;color:#6E5B9A;letter-spacing:-.2px}
}

/* --- 복사·드래그·단축키·인쇄 차단 --- */
(function guard(){
  var editable = function(el){
    if(!el || !el.tagName) return false;
    return /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable === true;
  };
  ["contextmenu","copy","cut","dragstart","dragover","drop"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!editable(e.target)) e.preventDefault(); }, true);
  });
  document.addEventListener("selectstart", function(e){ if(!editable(e.target)) e.preventDefault(); }, true);
  document.addEventListener("keydown", function(e){
    var k = (e.key || "").toLowerCase();
    var mod = e.ctrlKey || e.metaKey;
    if(k === "f12" || k === "printscreen"){ e.preventDefault(); return; }
    if(mod && e.shiftKey && ["i","j","c","k","s","p"].indexOf(k) >= 0){ e.preventDefault(); return; }
    if(mod && !e.shiftKey && !editable(e.target) && ["c","x","s","u","p","a"].indexOf(k) >= 0){ e.preventDefault(); return; }
  }, true);
})();

/* --- 유틸 --- */
function b64bytes(s){
  var bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesB64(u){
  var s = "", c = 0x8000;
  for(var i=0;i<u.length;i+=c) s += String.fromCharCode.apply(null, u.subarray(i, i + c));
  return btoa(s);
}

/* --- Web Crypto 경로 --- */
function deriveAes(pw){
  var data = new TextEncoder().encode(pw);
  return subtle.importKey("raw", data, "PBKDF2", false, ["deriveKey"]).then(function(base){
    return subtle.deriveKey({name:"PBKDF2", salt:b64bytes(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function aesOpen(key){
  return subtle.decrypt({name:"AES-GCM", iv:b64bytes(ENC.iv)}, key, b64bytes(ENC.ct)).then(function(buf){
    return new TextDecoder("utf-8").decode(new Uint8Array(buf));
  });
}
function aesImport(rawB64){ return subtle.importKey("raw", b64bytes(rawB64), {name:"AES-GCM"}, false, ["decrypt"]); }

/* --- 폴백 키스트림 경로 (Web Crypto 미지원 환경) --- */
function fnv1a(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h = (h ^ s.charCodeAt(i)) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}
function xs(s){
  var x = s[0], y = s[1], z = s[2], w = s[3];
  var t = (x ^ ((x << 11) >>> 0)) >>> 0;
  var n = (w ^ (w >>> 19) ^ t ^ (t >>> 8)) >>> 0;
  return [y, z, w, n];
}
function fbSeed(pw, saltHex){
  var base = pw + "\u0000" + saltHex, cur = base, w = [];
  for(var i=0;i<4;i++){ var h = fnv1a(cur); w.push(h); cur = base + "#" + h; }
  for(var j=0;j<1024;j++) w = xs(w);
  return w;
}
function ksBytes(seed, n){
  var s = seed.slice(0), out = new Uint8Array(n), k = 0;
  while(k < n){
    s = xs(s);
    var v = s[3];
    if(k < n) out[k++] = (v >>> 24) & 255;
    if(k < n) out[k++] = (v >>> 16) & 255;
    if(k < n) out[k++] = (v >>> 8) & 255;
    if(k < n) out[k++] = v & 255;
  }
  return out;
}
function fbOpen(seed, b64){
  var ct = b64bytes(b64), k = ksBytes(seed, ct.length), out = new Uint8Array(ct.length);
  for(var i=0;i<ct.length;i++) out[i] = ct[i] ^ k[i];
  return new TextDecoder("utf-8").decode(out);
}
function fbSeedFromCsv(csv){ return csv.split(",").map(function(x){ return Number(x) >>> 0; }); }

function remember(mode, val){
  try{ sessionStorage.setItem(STORE, JSON.stringify({m:mode, k:val, t:Date.now()})); }catch(e){}
}
function forget(){ try{ sessionStorage.removeItem(STORE); }catch(e){} }

function openWith(value){
  var plain = (value && value.indexOf("DM1|") === 0) ? value.slice(4) : null;
  return plain;
}

function attempt(pw){
  var chain = Promise.resolve(null);
  if(subtle){
    chain = deriveAes(pw).then(function(key){
      return aesOpen(key).then(function(text){
        var plain = openWith(text);
        if(!plain) throw new Error("bad magic");
        return subtle.exportKey("raw", key).then(function(raw){
          remember("aes", bytesB64(new Uint8Array(raw)));
          return plain;
        });
      });
    }).catch(function(){ return null; });
  }
  return chain.then(function(ok){
    if(ok) return ok;
    try{
      var seed = fbSeed(pw, ENC.saltHex);
      var plain = openWith(fbOpen(seed, ENC.fb.ct));
      if(plain){ remember("fb", seed.join(",")); return plain; }
    }catch(e){}
    return null;
  });
}

function restore(){
  var raw = null;
  try{ raw = sessionStorage.getItem(STORE); }catch(e){ return Promise.resolve(null); }
  if(!raw) return Promise.resolve(null);
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ forget(); return Promise.resolve(null); }
  if(o && o.m === "aes" && subtle){
    return aesImport(o.k).then(aesOpen).then(function(text){
      var plain = openWith(text);
      if(!plain) throw new Error("bad");
      return plain;
    }).catch(function(){ forget(); return null; });
  }
  if(o && o.m === "fb"){
    try{
      var plain = openWith(fbOpen(fbSeedFromCsv(o.k), ENC.fb.ct));
      if(plain) return Promise.resolve(plain);
    }catch(e){}
  }
  forget();
  return Promise.resolve(null);
}

/* ---------------- quiz ---------------- */
function startQuiz(list, title){
  if(!list.length) return;
  sess = { list, title, idx:0, sel:{}, graded:false };
  list.forEach((x,i)=> sess.sel[i] = []);
  renderQuiz();
}
function isCorrect(it, sel){
  if(it.kind==='typed'){
    const v = norm(sel[0]||'');
    return (it.accept||[]).some(a=>norm(a)===v);
  }
  if(it.kind==='selfcheck') return false;
  const a = (it.ans||[]).slice().sort((x,y)=>x-y).join(',');
  const s = (sel||[]).slice().sort((x,y)=>x-y).join(',');
  return a===s && a!=='';
}
function gradeCur(){
  const {it} = sess.list[sess.idx];
  if(it.kind==='selfcheck') return;
  const sel = sess.sel[sess.idx];
  if(!sel.length && it.kind!=='typed') return;
  if(it.kind==='typed' && !String(sel[0]||'').trim()) return;
  const ok = isCorrect(it, sel);
  const k = key(sess.list[sess.idx].sec, sess.list[sess.idx].idx);
  state.prog[k] = ok?2:1; save();
  sess.graded = true; renderQuiz(true);
}
function pick(i){
  const {it} = sess.list[sess.idx];
  if(sess.graded && state.mode==='practice') return;
  if(it.kind==='multi'){
    const cur = sess.sel[sess.idx].slice();
    const p = cur.indexOf(i);
    if(p>=0) cur.splice(p,1); else cur.push(i);
    sess.sel[sess.idx] = cur; renderQuiz();
  } else {
    sess.sel[sess.idx] = [i];
    if(state.mode==='practice') gradeCur(); else renderQuiz();
  }
}
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; sess.graded=false; renderQuiz(); }
  else finish();
}
function prevQ(){ if(sess.idx>0){ sess.idx--; sess.graded=false; renderQuiz(); } }

        <div class="res" style="color:#6E5B9A">📝 모범 답안</div>
        <div class="ansline">${it.model.map(m=>`• ${esc(m)}`).join('<br>')}</div>
        <div class="expl">조건을 모두 지켰으면 ‘맞았어요’, 아니면 ‘틀렸어요’를 눌러 주세요.</div>
        <div class="qnav" style="margin-top:10px"><button class="btn grow" id="selfNg">틀렸어요</button><button class="btn grow primary" id="selfOk">맞았어요</button></div></div>`;
  }

  const badge = it.badge ? `<span class="school ${/함정/.test(it.badge)?'trap':(/기출|중$|단원|고난도/.test(it.badge)?'hot':'')}">${esc(it.badge)}</span>` : '';
  const instr = it.kind==='multi' ? `<div class="stem" style="font-size:12.5px;color:#8C859B;font-weight:700;margin:-6px 0 10px">정답 개수는 문항마다 다릅니다. 해당하는 선지를 빠짐없이 모두 골라야 정답입니다.</div>` : '';
  const pbtn = it.p ? `<button class="pbtn" id="pBtn">📖 지문 보기</button>` : '';

  SCR.innerHTML = `
    <div class="qtop"><button class="iconbtn" id="back">←</button>
      <div class="progress"><i style="width:${Math.round((sess.idx+1)/total*100)}%"></i></div>
      <div class="qcount"><b>${sess.idx+1}</b> / ${total}</div>${pbtn}</div>
    <div class="qcard">
      <div class="qhead"><span class="qnum">${esc(sec.title)} ${it.n||sess.idx+1}</span>${badge}
        <span class="typepill">${it.kind==='multi'?'다중선택':it.kind==='ox'?'O/X':it.kind==='typed'?'주관식':it.kind==='selfcheck'?'서술형':'5지선다'}</span></div>
      <div class="stem">${rich(it.stem)}</div>${instr}
      ${it.pre?`<div class="box"><span class="lab">${esc(it.lab||'보기')}</span><div>${rich(it.pre)}</div></div>`:''}
      ${ch}
      ${(it.kind==='multi'||it.kind==='typed') && state.mode==='practice' && !sess.graded ? `<div class="qnav"><button class="btn grow primary" id="confirm" ${answered?'':'disabled'}>정답 확인</button></div>`:''}
      ${it.kind==='selfcheck' && !sess.selfOn ? `<div class="qnav"><button class="btn grow primary" id="showModel">모범 답안 보기</button></div>`:''}
      ${fb}
    </div>
    <div class="qnav">
      <button class="btn" id="prev" ${sess.idx===0?'disabled':''}>← 이전</button>
      <div class="spacer"></div>
      ${state.mode==='exam' && sess.idx===total-1 ? `<button class="btn primary" id="finish">채점하기</button>` : `<button class="btn primary" id="next">${sess.idx===total-1?'결과 보기':'다음 →'}</button>`}
    </div>`;

  document.getElementById('back').onclick = ()=>{ if(confirm('학습을 그만두고 홈으로 갈까요? 푼 문항은 저장됩니다.')) renderHome(); };
  document.getElementById('prev').onclick = prevQ;
  const nx = document.getElementById('next'); if(nx) nx.onclick = nextQ;
  const fin = document.getElementById('finish'); if(fin) fin.onclick = finish;
  if(document.getElementById('pBtn')) document.getElementById('pBtn').onclick = ()=> openSheet(DATA.passages[it.p].title, DATA.passages[it.p].src, passageHTML(it.p, true));
  SCR.querySelectorAll('[data-pick]').forEach(b=> b.onclick = ()=> pick(+b.dataset.pick));
  const cf = document.getElementById('confirm'); if(cf) cf.onclick = ()=>{ if(it.kind==='typed'){ sess.sel[sess.idx]=[document.getElementById('typeIn').value]; } gradeCur(); };
  const ti = document.getElementById('typeIn');
  if(ti){ ti.oninput = ()=>{ sess.sel[sess.idx]=[ti.value]; const c=document.getElementById('confirm'); if(c) c.disabled = !ti.value.trim(); }; ti.onkeydown = (e)=>{ if(e.key==='Enter'){ sess.sel[sess.idx]=[ti.value]; gradeCur(); } }; }
  const si = document.getElementById('selfIn'); if(si){ si.oninput = ()=>{ sess.sel[sess.idx]=[si.value]; }; }
  if(document.getElementById('showModel')) document.getElementById('showModel').onclick = ()=>{ sess.selfOn = true; renderQuiz(); };
  if(document.getElementById('selfOk')) document.getElementById('selfOk').onclick = ()=>{ state.prog[key(sec,idx)]=2; save(); sess.selfOn=false; if(sess.idx<sess.list.length-1){ nextQ(); } else finish(); };
  if(document.getElementById('selfNg')) document.getElementById('selfNg').onclick = ()=>{ state.prog[key(sec,idx)]=1; save(); sess.selfOn=false; if(sess.idx<sess.list.length-1){ nextQ(); } else finish(); };
}

function finish(){
  const total = sess.list.length;
  let right = 0;
  const bysec = {};
  const wrong = [];
  sess.list.forEach((x,i)=>{
    const sel = sess.sel[i] || [];
    let ok = false;
    if(x.it.kind==='selfcheck') ok = (state.prog[key(x.sec,x.idx)]===2);
    else if(x.it.kind==='typed' || x.it.kind==='ox' || x.it.kind==='single' || x.it.kind==='multi') ok = isCorrect(x.it, sel);
    if(ok) right ++; else wrong.push(x);
    (bysec[x.sec.id] = bysec[x.sec.id] || {name:x.sec.title, r:0, t:0});
    bysec[x.sec.id].t++; if(ok) bysec[x.sec.id].r++;
  });
  const pct = Math.round(right/total*100);
  const rows = Object.values(bysec).map(b=>{
    const p = Math.round(b.r/b.t*100);
    return `<div class="tstat"><span>${esc(b.name)}</span><span class="bar"><i style="width:${p}%"></i></span><span class="val">${b.r}/${b.t}</span></div>`;
  }).join('');
  SCR.innerHTML = `
    <div class="qtop"><button class="iconbtn" id="back">←</button><div style="font-weight:900;font-size:14px">${esc(sess.title)}</div></div>
    <div class="result"><div class="lab">RESULT</div>
      <div class="score">${pct}<span>점</span></div>
      <div class="scorem">${total}문항 중 ${right}문항 정답 · 오답 ${total-right}문항</div>
      <div class="tstats">${rows}</div>
      ${wrong.length?`<div class="wrongs"><h3>틀린 문항</h3><div class="wlist">${wrong.map(x=>`<span class="wchip">${esc(x.sec.title)} ${x.it.n||x.idx+1}</span>`).join('')}</div></div>`:''}
      <div class="ractions">
        ${wrong.length?`<button class="btn primary" id="again">틀린 문항 다시 풀기</button>`:''}
        <button class="btn" id="home">홈으로</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = renderHome;
  document.getElementById('home').onclick = renderHome;
  if(document.getElementById('again')) document.getElementById('again').onclick = ()=> startQuiz(wrong, '틀린 문항 다시 풀기');
}

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1600);
}

/* --- 잠금 화면 입력 처리 --- */
if(document.getElementById("dmForm")){
  document.getElementById("dmForm").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = (pwEl && pwEl.value ? pwEl.value : "").trim();
    if(!pw){ say("입장 비밀번호를 입력해 주세요."); if(pwEl) pwEl.focus(); return; }
    say("");
    if(btnEl){ btnEl.disabled = true; btnEl.textContent = "확인 중…"; }
    Promise.resolve(attempt(pw)).then(function(plain){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = "들어가기"; }
      if(!plain){
        say("비밀번호가 올바르지 않습니다. 다시 확인해 주세요.");
        if(pwEl){ pwEl.value = ""; pwEl.focus(); }
        return;
      }
      boot(plain);
    }).catch(function(){
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = "들어가기"; }
      say("확인 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.");
    });
  });
  if(pwEl) pwEl.addEventListener("input", function(){ say(""); });
}

(function start(){
  if(AUTO && AUTO.length === 4){
    try{
      var autoPlain = openWith(fbOpen(AUTO, ENC.fb.ct));
      if(autoPlain){ boot(autoPlain); return; }
    }catch(e){}
  }
  Promise.resolve(restore()).then(function(plain){
    if(plain){ boot(plain); } else { showLock(); }
  }).catch(function(){ showLock(); });
})();
})();
